<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317306F'/%3E%3Cpath d='M8 11h7M8 16h5M8 21h7' stroke='%23F2B33D' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M17.5 16.5l3 3 5-6.5' fill='none' stroke='%23ffffff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Hub de Soluções IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hub de Soluções IA: automação de processos, análise de documentos, relatórios e produtividade com IA, por Gustavo Stockler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de consulta. Barra superior; coluna esquerda com busca, visões, filtros por faceta e lista de soluções;
   área principal com resultados, detalhe da solução ou a aba de problemas. Cor neutra; azul "caneta de contador" como destaque. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#15191E; --muted:#5B646E; --line:#E2E5E9; --line2:#C9CED5;
  --accent:#2453C7; --accent-soft:rgba(36,83,199,.08); --on-accent:#FFFFFF;
  --ok:#1E7A4C; --warn:#A86400; --bad:#B4392A;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --side:300px; --top:60px; --side1:#17306F; --side2:#2453C7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#181B1F; --ink:#E8EAED; --muted:#9AA2AB; --line:#272B31; --line2:#3A4048;
  --accent:#86A8FF; --accent-soft:rgba(134,168,255,.10); --on-accent:#0E1420;
  --ok:#5CC48C; --warn:#E2AA4C; --bad:#E57565; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --side1:#0E1A3A; --side2:#1B3270; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#181B1F; --ink:#E8EAED; --muted:#9AA2AB; --line:#272B31; --line2:#3A4048;
  --accent:#86A8FF; --accent-soft:rgba(134,168,255,.10); --on-accent:#0E1420;
  --ok:#5CC48C; --warn:#E2AA4C; --bad:#E57565; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --side1:#0E1A3A; --side2:#1B3270; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 12px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.75rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);min-width:0}
.logo b{font-family:var(--f-display);font-weight:780;font-variation-settings:"wdth" 82,"opsz" 36;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap}
.logo i{font-style:normal;font-family:var(--f-code);font-size:.72rem;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:.1rem .35rem}
.top .sp{flex:1}
.iconbtn.menu{display:none}
.top .logo{display:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:36px;padding:0 .7rem;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:.875rem}
.iconbtn:hover{border-color:var(--ink)}
.theme{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;height:36px}
.theme button{border:0;background:transparent;padding:0 .65rem;cursor:pointer;color:var(--muted);font-size:.82rem;font-weight:600}
.theme button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:.55rem .95rem;border-radius:8px;font-weight:600;text-decoration:none;cursor:pointer;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:.35rem .7rem;font-size:.82rem}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn svg{flex:none}

/* Estrutura */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.col{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow:auto;overscroll-behavior:contain;color:#fff;
  background:linear-gradient(180deg,var(--side1),var(--side2));
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem 1.25rem max(1rem,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:1.1rem}
.sbrand{display:flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none}
.sbrand svg{flex:none}
.sbrand b{font-family:var(--f-display);font-weight:760;font-variation-settings:"wdth" 85,"opsz" 36;font-size:1.25rem;line-height:1.05}
.side h4{margin:0;font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem}
.sbox{position:relative}
.sbox input{width:100%;height:42px;padding:0 .8rem 0 2.3rem;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(255,255,255,.12);color:#fff}
.sbox input::placeholder{color:rgba(255,255,255,.7)}
.sbox svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.8)}
.funnel{display:inline-flex;align-items:center;gap:.35rem;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:.25rem .55rem;cursor:pointer;font-size:.78rem;font-weight:600}
.funnel[aria-expanded="true"]{background:#fff;color:var(--side2)}
.funnel .b{background:#F2B33D;color:#1A1200;border-radius:999px;font-size:.7rem;padding:0 .4rem;font-weight:800}
.fpanel{background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:.8rem;display:grid;gap:.8rem;margin-bottom:.6rem}
.fpanel h5{margin:0 0 .4rem;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.85)}
.fpanel .legend{font-size:.75rem;color:rgba(255,255,255,.75);margin:.35rem 0 0}
.facet{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:.28rem .65rem;cursor:pointer;font-size:.82rem;color:var(--ink)}
.chip .c{color:var(--muted);font-size:.75rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}
.chip:disabled{opacity:.4;cursor:default}
.side .chip{border-color:rgba(255,255,255,.35);color:#fff}
.side .chip .c{color:rgba(255,255,255,.7)}
.side .chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--side2)}
.side .chip[aria-pressed="true"] .c{color:var(--side2)}
.clear{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:600;font-size:.82rem;padding:0}
.side .clear{color:#fff;text-decoration:underline;font-size:.78rem;justify-self:start}
.slist{display:grid;gap:.25rem}
.sitem{display:flex;align-items:center;gap:.65rem;padding:.5rem .6rem;border-radius:12px;text-decoration:none;color:#fff;font-size:.93rem;line-height:1.25}
.sitem:hover{background:rgba(255,255,255,.1)}
.sitem .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-family:var(--f-code);font-size:.7rem;font-weight:600}
.sitem small{display:block;font-size:.75rem;color:rgba(255,255,255,.7);margin-top:.1rem}
.sitem[aria-current="page"]{background:#fff;color:var(--side2);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sitem[aria-current="page"] .ic{background:#F2B33D;color:#1A1200}
.sitem[aria-current="page"] small{color:#5B646E}
.sitem.off{display:none}
.sgroup{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;margin-top:.35rem}
.ghead{display:flex;align-items:center;gap:.55rem;border:0;background:transparent;color:#fff;cursor:pointer;text-align:left;padding:.45rem .6rem;border-radius:10px;font-weight:700;font-size:.9rem;min-width:0}
.ghead:hover{background:rgba(255,255,255,.1)}
.ghead.on{background:rgba(242,179,61,.22);box-shadow:inset 0 0 0 1px #F2B33D}
.ghead .gn{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#F2B33D;color:#1A1200;font-size:.75rem;font-family:var(--f-code)}
.ghead .gt{min-width:0}
.gtog{border:0;background:transparent;color:rgba(255,255,255,.8);cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.gtog:hover{background:rgba(255,255,255,.1)}
.gitems{grid-column:1/-1;display:grid;gap:.15rem;margin:.1rem 0 .2rem .9rem;padding-left:.6rem;border-left:1px solid rgba(255,255,255,.22)}
.gitems .sitem{padding:.4rem .5rem;font-size:.9rem}
.gitems .sitem .ic{width:30px;height:26px;font-size:.66rem}
.funnel.wide{width:100%;justify-content:flex-start;padding:.5rem .7rem;border-radius:10px;border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.9)}
.side > section + section{margin-top:.1rem}
.side > *{flex:none}
/* Navegação em árvore, estilo explorador de arquivos */
.side{gap:.9rem}
.nsec{border-top:1px solid rgba(255,255,255,.14);padding-top:.55rem}
.nhead{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:rgba(255,255,255,.72);cursor:pointer;padding:.25rem .35rem;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:6px}
.nhead:hover{color:#fff}
.nhead em{font-style:normal;background:#F2B33D;color:#1A1200;border-radius:999px;padding:0 .4rem;margin-left:.35rem;letter-spacing:0}
.nbody{display:grid;gap:1px;margin-top:.3rem}
.nrow{display:flex;align-items:center;gap:.5rem;width:100%;min-height:32px;padding:.3rem .5rem;border:0;border-radius:7px;background:transparent;color:rgba(255,255,255,.88);text-decoration:none;font-size:.9rem;line-height:1.3;text-align:left;cursor:pointer}
.nrow:hover{background:rgba(255,255,255,.09);color:#fff}
.nrow[aria-current="page"]{background:rgba(255,255,255,.17);color:#fff;font-weight:600}
.nrow .i{flex:none;color:rgba(255,255,255,.7)}
.nrow[aria-current="page"] .i{color:#F2B33D}
.nrow .chev{flex:none;color:rgba(255,255,255,.6)}
.nrow.folder .i{color:#9DB7F5}
.nrow.folder.on{color:#fff;font-weight:600}
.nrow.folder.on .i{color:#F2B33D}
.nrow span{min-width:0}
.nkids{display:grid;gap:1px;margin-left:1.05rem;padding-left:.5rem;border-left:1px solid rgba(255,255,255,.16)}
.nrow.leaf{font-size:.88rem}
.nrow .cnt{margin-left:auto;font-size:.72rem;font-weight:700;color:#fff;background:#E5534B;border-radius:999px;padding:0 .45rem}
.nclear{justify-self:start;border:0;background:transparent;color:#fff;text-decoration:underline;font-size:.78rem;cursor:pointer;padding:.3rem .5rem}
.nsec .facet{padding:.2rem .35rem}
.nsec .chip{font-size:.78rem;padding:.2rem .55rem}
.funnel.wide[aria-expanded="true"]{background:#fff;color:var(--side2);border-color:#fff}
.sitem.all .ic{background:#F2B33D;color:#1A1200;font-size:1rem}
.side .n{margin-left:auto;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:.05rem .5rem}
.sitem[aria-current="page"] .n{background:var(--accent-soft);color:var(--side2)}
.sitem.prob .n{background:#E5534B;color:#fff}
.sitem.prob .ic{font-size:1rem}
.side .nohit{font-size:.82rem;color:rgba(255,255,255,.75);margin:.2rem .6rem}
.sfoot{margin-top:auto;font-size:.78rem;color:rgba(255,255,255,.7);padding-top:.6rem;border-top:1px solid rgba(255,255,255,.16)}
.sfoot a{color:#fff}
.side .theme{display:none;border-color:rgba(255,255,255,.3);align-self:flex-start}
.side .theme button{color:rgba(255,255,255,.8)}
.side .theme button[aria-pressed="true"]{background:#fff;color:var(--side2)}
.main{min-width:0;padding:1.5rem max(16px,env(safe-area-inset-right,0px)) 3rem clamp(16px,3vw,2.5rem)}
.wrapm{max-width:1080px}

/* Topo da visão geral */
.intro{display:grid;gap:1rem;padding:.5rem 0 1.5rem;border-bottom:1px solid var(--line);margin-bottom:1.25rem}
.fx{display:grid;grid-template-columns:auto auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line2);border-radius:6px;max-width:640px;font-family:var(--f-code);font-size:.85rem;overflow:hidden}
.fx > span{padding:.45rem .7rem}
.fx .ref,.fx .fn{color:var(--muted);border-right:1px solid var(--line2)}
.fx .fn{font-style:italic}
.fx .f{white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.fx .k{color:var(--accent);font-weight:500}.fx .s{color:var(--warn)}
h1.h{font-family:var(--f-display);font-weight:780;font-variation-settings:"wdth" 80,"opsz" 96;font-size:clamp(2.4rem,6.5vw,4.6rem);line-height:.92;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lead{margin:0;max-width:62ch;font-size:1.05rem;color:var(--ink)}
.by{color:var(--muted);font-size:.92rem}
.by strong{color:var(--ink)}

/* Barra de resultado */
.rbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-bottom:1rem}
.rbar .tot{font-weight:700;border-bottom:3px double var(--ink);padding-bottom:.15rem}
.active{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.tag{display:inline-flex;align-items:center;gap:.3rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:.2rem .3rem .2rem .65rem;font-size:.8rem;font-weight:600}
.tag button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 .3rem}

/* Cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.card .shot{display:block;aspect-ratio:16/10;max-width:100%;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block;transition:transform .25s ease}
.card:hover .shot img{transform:scale(1.03)}
.cb{padding:1rem 1.1rem 1.1rem;display:grid;gap:.5rem;flex:1;align-content:start}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:center;font-size:.8rem;color:var(--muted)}
.meta .code{font-family:var(--f-code)}
.card h3{margin:0;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 92;font-size:1.3rem;line-height:1.15;text-wrap:balance}
.card h3 a{color:inherit;text-decoration:none}.card h3 a:hover{color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tools{display:flex;flex-wrap:wrap;gap:.3rem}
.tool{font-size:.74rem;padding:.1rem .45rem;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.cacts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.35rem}
.st{display:inline-flex;align-items:center;gap:.35rem;font-weight:600}
.st i{width:.55rem;height:.55rem;border-radius:50%;background:currentColor;display:inline-block}
.s-uso{color:var(--ok)}.s-dev{color:var(--warn)}.s-ideia{color:var(--muted)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:2rem 1.25rem;text-align:center;color:var(--muted);background:var(--surface)}

/* Detalhe */
.crumb{display:flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--muted);margin-bottom:1rem;flex-wrap:wrap}
.crumb a{color:var(--accent);text-decoration:none;font-weight:600}
.det{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.det .big{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);aspect-ratio:16/10;max-width:100%}
.det .big img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.det h2{font-family:var(--f-display);font-weight:780;font-variation-settings:"wdth" 82,"opsz" 72;font-size:clamp(2rem,4.5vw,3rem);line-height:.98;letter-spacing:-.02em;margin:.2rem 0 .6rem;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:1rem 0}
.facts div{padding:.55rem .5rem .6rem 0;min-width:0}
.facts dt{font-size:.78rem;color:var(--muted)}.facts dd{margin:0;font-weight:600}
.notes{display:grid;gap:1rem;margin-top:1.25rem;grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
.note h4{margin:0 0 .35rem;font-size:.85rem;color:var(--muted)}
.note.p h4{color:var(--bad)}.note.s h4{color:var(--ok)}
.note p{margin:0;white-space:pre-line}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;grid-column:1/-1;flex-wrap:wrap}

/* Problemas */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.5rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem;box-shadow:var(--shadow)}
.panel h3{margin:0 0 .2rem;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 92;font-size:1.3rem}
.panel > p{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
form.ask{display:grid;gap:.85rem}
.seg{display:flex;gap:.5rem}
.seg label{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line2);border-radius:999px;padding:.35rem .85rem;cursor:pointer;font-weight:600}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input{accent-color:var(--accent)}
form.ask label.f{display:grid;gap:.3rem;font-size:.85rem;color:var(--muted);min-width:0}
form.ask input[type=text],form.ask select,form.ask textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line2);background:var(--bg);border-radius:8px;color:var(--ink)}
form.ask textarea{min-height:5.5rem;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.ptools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.plist{display:grid;gap:.6rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:.85rem 1rem;display:grid;gap:.35rem}
.pcard.ideia{border-left-color:var(--warn)}
.pcard h4{margin:0;font-size:1.02rem}
.pcard p{margin:0;color:var(--muted);font-size:.9rem;white-space:pre-line}
.kind{font-size:.72rem;font-weight:700;padding:.08rem .5rem;border-radius:999px;border:1px solid currentColor}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- Plano de contas: código por área ---------- */
var AREAS=[];P.forEach(function(p){if(AREAS.indexOf(p.category)<0)AREAS.push(p.category)});
var CODE={};(function(){var c={};P.forEach(function(p){var g=AREAS.indexOf(p.category)+1;c[g]=(c[g]||0)+1;CODE[p.id]=g+"."+String(c[g]).padStart(2,"0")})})();

/* ---------- Filtros ---------- */
function textOf(p){return [p.title,p.summary,p.category,p.problem,p.solution,(p.tools||[]).join(" ")].join(" ").toLowerCase()}
function match(p,skip){
  var q=F.q.trim().toLowerCase();
  if(q&&q.split(/\s+/).some(function(w){return textOf(p).indexOf(w)<0}))return false;
  if(skip!=="area"&&F.area.length&&F.area.indexOf(p.category)<0)return false;
  if(skip!=="status"&&F.status.length&&F.status.indexOf(p.status)<0)return false;
  if(skip!=="tool"&&F.tool.length&&!F.tool.some(function(t){return (p.tools||[]).indexOf(t)>=0}))return false;
  return true;
}
function filtered(){return P.filter(function(p){return match(p)})}
function facetCounts(key){var out={};P.forEach(function(p){if(!match(p,key))return;var vals=key==="area"?[p.category]:key==="status"?[p.status]:(p.tools||[]);vals.forEach(function(v){out[v]=(out[v]||0)+1})});return out}
function allVals(key){var s=[];P.forEach(function(p){(key==="area"?[p.category]:key==="status"?[p.status]:(p.tools||[])).forEach(function(v){if(s.indexOf(v)<0)s.push(v)})});return s}
function anyFilter(){return F.q||F.area.length||F.tool.length||F.status.length}

/* ---------- Problemas (sem solução) ---------- */

var CFG=S.problems||{};
function remoteOn(){return !!(safeUrl(CFG.formAction)&&CFG.fields&&CFG.fields.titulo)}
function localItems(){try{return JSON.parse(store("ps-problemas")||"[]")}catch(e){return []}}
function saveLocal(a){store("ps-problemas",JSON.stringify(a))}
function parseCSV(t){var r=[],row=[],f="",q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!=="\r")f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function loadProblems(){
  var loc=localItems().map(function(x){x.local=true;return x});
  if(!safeUrl(CFG.csv)){PROB.items=loc;PROB.loaded=true;refreshCounts();return}
  fetch(safeUrl(CFG.csv)).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    var rows=parseCSV(t),h=(rows.shift()||[]).map(function(x){return x.toLowerCase()});
    function col(re){for(var i=0;i<h.length;i++)if(re.test(h[i]))return i;return -1}
    var ci={d:col(/carimbo|timestamp|data/),k:col(/tipo/),t:col(/t[ií]tulo/),a:col(/[áa]rea/),h:col(/hoje|acontece/),i:col(/ideal/),n:col(/nome|linkedin/),s:col(/status|situa/)};
    var rem=rows.filter(function(r){return r.join("").trim()}).map(function(r){var g=function(k){return ci[k]>=0?(r[ci[k]]||"").trim():""};
      return {date:g("d"),kind:/ideia/i.test(g("k"))?"Ideia":"Problema",title:g("t"),area:g("a"),hoje:g("h"),ideal:g("i"),nome:g("n"),status:g("s")}})
      .filter(function(x){return x.title&&!/resolvid|solu|fechad|exclu/i.test(x.status)}).reverse();
    PROB.items=rem.concat(loc);PROB.remote=true;PROB.loaded=true;refreshCounts();if(route()==="problemas")renderProblems();
  }).catch(function(){PROB.items=loc;PROB.loaded=true;refreshCounts();if(route()==="problemas")renderProblems()});
}
function refreshCounts(){var n=document.getElementById("probN");if(n)n.textContent=PROB.items.length}

  h+='<div class="sbox"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>'+
    '<input id="q" type="search" placeholder="Buscar" aria-label="Buscar solução" value="'+esc(F.q)+'"></div>';
  var b='<a class="nrow" href="#todas" data-all="1"'+(r==="todas"&&!F.area.length?' aria-current="page"':'')+'>'+I.all+'<span>Todas as soluções</span></a>';
  b+=list.map(function(p){return '<a class="nrow leaf" href="#'+esc(p.id)+'"'+(r===p.id?' aria-current="page"':'')+'>'+I.doc+'<span>'+esc(p.title)+'</span></a>'}).join("");
  if(!list.length)b+='<p class="nohit">Nada encontrado.</p>';
  if(anyFilter())b+='<button class="nclear" data-clear="all">Limpar filtros</button>';
  h+=sec("sol","Soluções",b);
  var cnt=facetCounts("tool");
  h+=sec("fil","Ferramentas"+(nt?' <em>'+nt+'</em>':''),'<div class="facet">'+allVals("tool").map(function(v){var on=F.tool.indexOf(v)>=0,c=cnt[v]||0;return '<button class="chip" data-f="tool" data-v="'+esc(v)+'" aria-pressed="'+on+'"'+(!c&&!on?' disabled':'')+'>'+esc(v)+'</button>'}).join("")+'</div>');
  h+=sec("prob","Problemas e Soluções",'<a class="nrow" href="#problemas"'+(r==="problemas"?' aria-current="page"':'')+'>'+I.q+'<span>Problemas sem solução</span><span class="cnt" id="probN">'+PROB.items.length+'</span></a>');
  var th=store("ps-tema")||"auto";
  h+='<div class="theme" role="group" aria-label="Tema">'+[["auto","Auto"],["light","Claro"],["dark","Escuro"]].map(function(x){return '<button type="button" data-t="'+x[0]+'" aria-pressed="'+(th===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
  h+='<div class="sfoot">'+byline()+'</div>';
  var focusQ=document.activeElement&&document.activeElement.id==="q",pos=focusQ?document.activeElement.selectionStart:0;
  side.innerHTML=h;
  var q=document.getElementById("q");
  if(focusQ){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}
  q.addEventListener("input",function(){F.q=q.value;if(route()!=="todas"&&F.q)go("todas");else update()});
  side.querySelectorAll("[data-sec]").forEach(function(x){x.onclick=function(){var k=x.getAttribute("data-sec");SOPEN[k]=!SOPEN[k];renderSide()}});
  side.querySelectorAll(".chip").forEach(function(x){x.onclick=function(){var v=x.getAttribute("data-v"),i=F.tool.indexOf(v);if(i>=0)F.tool.splice(i,1);else F.tool.push(v);if(route()!=="todas")go("todas");else update()}});
  /* pasta: abre/fecha; ao abrir, mostra só aquela área na página */
  side.querySelectorAll("[data-area]").forEach(function(x){x.onclick=function(){var a=x.getAttribute("data-area"),open=GOPEN[a]!==false,on=F.area.indexOf(a)>=0;
    if(on){F.area=[];GOPEN[a]=false}else{F.area=[a];GOPEN[a]=true}
    if(route()!=="todas")go("todas");else update()}});
  side.querySelector("[data-all]").addEventListener("click",function(){if(F.area.length){F.area=[];if(route()==="todas")update()}});
  side.querySelectorAll("[data-clear]").forEach(function(x){x.onclick=function(){F.q="";F.area=[];F.tool=[];F.status=[];update()}});
  side.querySelectorAll("a").forEach(function(a){a.addEventListener("click",closeDrawer)});
  side.querySelectorAll(".theme button").forEach(function(x){x.onclick=function(){var v=x.getAttribute("data-t");store("ps-tema",v);applyTheme(v)}});
}
function byline(){var li=safeUrl(S.linkedin),n=esc(S.author||"Gustavo Stockler");return 'Construído por '+(li?'<a href="'+esc(li)+'" target="_blank" rel="noopener">'+n+'</a>':n)}

/* ---------- Visão: todas ---------- */
var typed=false;
function formula(){return '<span class="k">=SE</span>(<span class="k">PROBLEMA</span>; <span class="k">SOLUÇÃO</span>(<span class="s">"FP&amp;A"</span>; <span class="s">"Controladoria"</span>; <span class="s">"IA"</span>))'}
function cardHtml(p){
  var img=safeImg(p.preview),link=safeUrl(p.link);
  return '<article class="card"><a class="shot" href="#'+esc(p.id)+'" aria-label="Ver detalhes de '+esc(p.title)+'">'+(img?'<img src="'+esc(img)+'" alt="" loading="lazy">':'')+'</a>'+
    '<div class="cb"><div class="meta"><span>'+esc(p.category)+'</span></div>'+
    '<h3><a href="#'+esc(p.id)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.summary)+'</p>'+
    '<div class="tools">'+(p.tools||[]).map(function(t){return '<span class="tool">'+esc(t)+'</span>'}).join("")+'</div>'+
    '<div class="cacts">'+(link?'<a class="btn primary sm" href="'+esc(link)+'" target="_blank" rel="noopener">Abrir projeto '+EXT+'</a>':'')+'<a class="btn sm" href="#'+esc(p.id)+'">Ver detalhes</a></div></div></article>';
}
function renderAll(){
  var list=filtered(),showIntro=!anyFilter();
  var h='';
  if(showIntro)h+='<section class="intro"><div class="fx" aria-label="Fórmula"><span class="ref">A1</span><span class="fn">fx</span><span class="f" id="fx">'+formula()+'</span></div>'+
    '<h1 class="h">'+esc(S.brand||"Hub de Soluções IA")+'</h1><p class="lead">'+esc(S.intro)+'</p>'+
    '<div class="by">'+byline()+(S.role?' · '+esc(S.role):'')+'</div></section>';
  h+='<div class="rbar"><span class="tot">'+(F.area.length===1&&!F.q&&!F.tool.length?esc(F.area[0])+': ':'')+list.length+(list.length===1?' solução':' soluções')+'</span><div class="active">'+activeTags()+'</div></div>';
  h+=list.length?'<div class="grid">'+list.map(cardHtml).join("")+'</div>':'<div class="empty">Nenhuma solução com esses filtros. <button class="clear" data-clear2="1">Limpar filtros</button> ou <a href="#problemas">conte o problema</a> que ainda não tem solução.</div>';
  h+=foot();
  view.innerHTML=h;
  view.querySelectorAll(".tag button").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-k"),v=b.getAttribute("data-v");if(k==="q")F.q="";else F[k].splice(F[k].indexOf(v),1);update()}});
  var c2=view.querySelector("[data-clear2]");if(c2)c2.onclick=function(){F.q="";F.area=[];F.tool=[];F.status=[];update()};
  if(showIntro&&!typed){typed=true;typeFx()}
}
function activeTags(){
  var t=[];if(F.q)t.push(['q',F.q,'Busca: '+F.q]);
  ["area","tool"].forEach(function(k){F[k].forEach(function(v){t.push([k,v,v])})});
  return t.map(function(x){return '<span class="tag">'+esc(x[2])+'<button data-k="'+x[0]+'" data-v="'+esc(x[1])+'" aria-label="Remover filtro '+esc(x[2])+'">×</button></span>'}).join("");
}
function typeFx(){
  var el=document.getElementById("fx");if(!el)return;try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  var full=el.innerHTML,txt=el.textContent,i=0;el.textContent="";
  var t=setInterval(function(){i+=2;el.textContent=txt.slice(0,i);if(i>=txt.length){clearInterval(t);el.innerHTML=full}},26);
}
function foot(){return '<footer><span>'+(S.updatedAt?'Atualizado em '+esc(fmtDate(S.updatedAt)):'')+'</span><span>'+byline()+'</span></footer>'}

/* ---------- Visão: detalhe ---------- */
function renderDetail(id){
  var i=-1;P.forEach(function(p,k){if(p.id===id)i=k});if(i<0){go("todas");return}
  var p=P[i],img=safeImg(p.previewLarge||p.preview),link=safeUrl(p.link),prev=P[(i-1+P.length)%P.length],next=P[(i+1)%P.length];
  function note(c,t,v){return v?'<div class="note '+c+'"><h4>'+t+'</h4><p>'+esc(v)+'</p></div>':''}
  var h='<div class="crumb"><a href="#todas">Todas as soluções</a><span>/</span><span>'+esc(p.category)+'</span></div>'+
  '<article class="det"><div class="big">'+(img?'<img src="'+esc(img)+'" alt="Tela do projeto '+esc(p.title)+'">':'')+'</div>'+
  '<div><div class="meta"></div>'+
  '<h2>'+esc(p.title)+'</h2><p class="lead">'+esc(p.summary)+'</p>'+
  '<dl class="facts"><div><dt>Área</dt><dd>'+esc(p.category)+'</dd></div><div><dt>Ano</dt><dd>'+esc(p.year||"—")+'</dd></div><div><dt>Ferramentas</dt><dd>'+esc((p.tools||[]).join(", "))+'</dd></div></dl>'+
  '<div class="cacts">'+(link?'<a class="btn primary" href="'+esc(link)+'" target="_blank" rel="noopener">Abrir projeto '+EXT+'</a>':'')+'</div></div>'+
  '<div class="notes">'+note("p","Problema",p.problem)+note("s","Solução",p.solution)+note("r","Resultado",p.impact)+'</div>'+
  '<div class="pn"><a class="btn" href="#'+esc(prev.id)+'">← '+esc(prev.title)+'</a><a class="btn" href="#'+esc(next.id)+'">'+esc(next.title)+' →</a></div></article>'+foot();
  view.innerHTML=h;
}

/* ---------- Visão: problemas ---------- */
var PFILT="todos";
function renderProblems(){
  var areas=["Orçamento","Forecast","Fechamento contábil","DRE e relatórios","Custos","Fluxo de caixa","Indicadores","Outro"];
  var items=PROB.items.filter(function(x){return PFILT==="todos"||x.kind===PFILT});
  var h='<div class="crumb"><a href="#todas">Todas as soluções</a><span>/</span><span>Problemas sem solução</span></div>'+
  '<h1 class="h" style="font-size:clamp(2rem,5vw,3.4rem);margin-bottom:.5rem">Problemas sem solução</h1>'+
  '<p class="lead" style="margin-bottom:1.25rem">O que ainda dá trabalho em FP&amp;A e controladoria. Quando um destes ganhar solução, ele vira um projeto na lista.</p>'+
  (remoteOn()?'':'<div class="banner">Por enquanto os problemas ficam salvos <strong>neste navegador</strong>. Use “Exportar para Excel” para guardar ou enviar a lista.</div>')+
  '<div class="pgrid"><section class="panel" aria-labelledby="np"><h3 id="np">Novo problema ou ideia</h3><p>Leva um minuto. Os campos com * são obrigatórios.</p>'+
  '<form class="ask" id="askf"><div class="seg" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="k" value="Problema" checked> Problema</label><label><input type="radio" name="k" value="Ideia"> Ideia</label></div>'+
  '<label class="f" for="a-t">Título *<input type="text" id="a-t" maxlength="120" placeholder="Ex.: Consolidar o forecast de 12 áreas leva 3 dias"></label>'+
  '<label class="f" for="a-a">Área<select id="a-a">'+areas.map(function(a){return '<option>'+a+'</option>'}).join("")+'</select></label>'+
  '<label class="f" for="a-h">O que acontece hoje *<textarea id="a-h" placeholder="Como é feito, quanto tempo leva, onde costuma dar erro"></textarea></label>'+
  '<label class="f" for="a-i">Como seria o ideal<textarea id="a-i" placeholder="O que mudaria se isso estivesse resolvido"></textarea></label>'+
  '<label class="f" for="a-n">Seu nome (opcional)<input type="text" id="a-n" maxlength="80"></label>'+
  '<div class="cacts"><button class="btn primary" type="submit">Salvar problema</button></div></form></section>'+
  '<section aria-labelledby="pl"><div class="ptools"><h3 id="pl" style="margin:0;font-family:var(--f-display);font-variation-settings:\'wdth\' 92;font-size:1.3rem">Lista ('+items.length+')</h3>'+
  '<div class="facet"><button class="chip" data-p="todos" aria-pressed="'+(PFILT==="todos")+'">Todos</button><button class="chip" data-p="Problema" aria-pressed="'+(PFILT==="Problema")+'">Problemas</button><button class="chip" data-p="Ideia" aria-pressed="'+(PFILT==="Ideia")+'">Ideias</button></div>'+
  (PROB.items.length?'<button class="btn sm" id="exp" type="button">Exportar para Excel</button>':'')+'</div><div class="plist">'+
  (PROB.loaded?(items.length?items.map(function(x,k){return '<article class="pcard'+(x.kind==="Ideia"?' ideia':'')+'"><div class="meta"><span class="kind '+(x.kind==="Ideia"?'ideia':'prob')+'">'+esc(x.kind)+'</span>'+(x.area?'<span>'+esc(x.area)+'</span>':'')+(x.date?'<span>'+esc(fmtDate(x.date)||x.date)+'</span>':'')+(x.nome?'<span>por '+esc(x.nome)+'</span>':'')+'</div>'+
    '<h4>'+esc(x.title)+'</h4>'+(x.hoje?'<p>'+esc(x.hoje)+'</p>':'')+(x.ideal?'<p><strong>Ideal:</strong> '+esc(x.ideal)+'</p>':'')+(x.local?'<div><button class="btn danger sm" data-del="'+esc(x.id)+'">Excluir</button></div>':'')+'</article>'}).join("")
    :'<div class="empty">Nenhum item ainda. Use o formulário para salvar o primeiro.</div>'):'<div class="empty">Carregando…</div>')+'</div></section></div>'+foot();
  view.innerHTML=h;
  view.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){PFILT=b.getAttribute("data-p");renderProblems()}});
  view.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){
    if(b.getAttribute("data-ok")!=="1"){b.setAttribute("data-ok","1");b.textContent="Confirmar exclusão";return}
    var id=b.getAttribute("data-del");saveLocal(localItems().filter(function(x){return x.id!==id}));PROB.items=PROB.items.filter(function(x){return !(x.local&&x.id===id)});refreshCounts();renderProblems();toast("Excluído")}});
  var ex=document.getElementById("exp");if(ex)ex.onclick=exportCsv;
  document.getElementById("askf").addEventListener("submit",submitProblem);
}
function submitProblem(e){
  e.preventDefault();var g=function(id){return document.getElementById(id).value.trim()};
  var k=(document.querySelector('#askf input[name=k]:checked')||{}).value||"Problema";
  var x={id:"p"+Date.now(),date:new Date().toISOString().slice(0,10),kind:k,title:g("a-t"),area:g("a-a"),hoje:g("a-h"),ideal:g("a-i"),nome:g("a-n")};
  if(!x.title||!x.hoje){toast("Preencha o título e o que acontece hoje");return}
  if(remoteOn()){
    var fd=new URLSearchParams(),f=CFG.fields;
    [["tipo",x.kind],["titulo",x.title],["area",x.area],["hoje",x.hoje],["ideal",x.ideal],["nome",x.nome]].forEach(function(a){if(f[a[0]])fd.append(f[a[0]],a[1])});
    fetch(safeUrl(CFG.formAction),{method:"POST",mode:"no-cors",body:fd}).then(function(){
      x.local=false;PROB.items.unshift(x);refreshCounts();renderProblems();toast("Problema salvo. Obrigado!");
    }).catch(function(){toast("Não foi possível salvar agora. Verifique a internet e tente de novo.")});
    return;
  }
  var a=localItems();a.unshift(x);saveLocal(a);x.local=true;PROB.items.unshift(x);refreshCounts();renderProblems();toast("Problema salvo neste navegador");
}
function exportCsv(){
  var rows=[["Data","Tipo","Título","Área","O que acontece hoje","Como seria o ideal","Nome"]].concat(PROB.items.map(function(x){return [x.date,x.kind,x.title,x.area,x.hoje,x.ideal,x.nome]}));
  var csv="﻿"+rows.map(function(r){return r.map(function(v){v=String(v||"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")}).join("\r\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="problemas-sem-solucao.csv";document.body.appendChild(a);a.click();a.remove();
  toast("Arquivo baixado: problemas-sem-solucao.csv");
}

/* ---------- Rotas ---------- */
function route(){var h=location.hash.replace(/^#/,"");if(!h||h==="todas")return "todas";if(h==="problemas")return "problemas";return h}
function go(r){if(location.hash!=="#"+r)location.hash=r;else update()}
function update(){
  var r=route();renderSide();
  if(r==="todas")renderAll();else if(r==="problemas")renderProblems();else renderDetail(r);
}
window.addEventListener("hashchange",function(){update();window.scrollTo(0,0)});

/* ---------- Gaveta no celular ---------- */
var menuBtn=document.getElementById("menuBtn");
function closeDrawer(){document.body.classList.remove("drawer");menuBtn.setAttribute("aria-expanded","false")}
menuBtn.onclick=function(){var o=document.body.classList.toggle("drawer");menuBtn.setAttribute("aria-expanded",String(o))};
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer()});

update();loadProblems();
})();
</script>

</body></html>
