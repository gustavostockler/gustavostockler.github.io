<style id="css">
/* Layout: prancheta de projeto. Hero em papel quadriculado, acervo como pranchas técnicas com carimbo (nº, status, ano). */
:root{
  --paper:#F2F5FA; --sheet:#FFFFFF; --ink:#0F2754; --muted:#55678A; --line:rgba(31,79,216,.11); --rule:rgba(15,39,84,.16);
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --mark:#F3A712; --ok:#147A4B; --warn:#A35A00; --idea:#6A4FC9;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1736; --sheet:#0F2048; --ink:#E7EEFF; --muted:#9DB0D6; --line:rgba(150,185,255,.10); --rule:rgba(200,215,255,.18);
  --accent:#86A8FF; --accent-ink:#0A1736; --mark:#FFC24B; --ok:#5FD39A; --warn:#FFB45C; --idea:#B9A6FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1736; --sheet:#0F2048; --ink:#E7EEFF; --muted:#9DB0D6; --line:rgba(150,185,255,.10); --rule:rgba(200,215,255,.18);
  --accent:#86A8FF; --accent-ink:#0A1736; --mark:#FFC24B; --ok:#5FD39A; --warn:#FFB45C; --idea:#B9A6FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}

/* Hero */
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 3.5rem);padding-bottom:2.5rem;
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),
    linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;border-bottom:1px solid var(--rule)}
.hero .wrap{display:grid;gap:1.5rem}
.eyebrow{color:var(--muted);display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
.eyebrow span::before{content:"+ ";color:var(--accent)}
h1.brand{font-family:var(--f-display);font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;
  font-size:clamp(2.6rem,9vw,6.6rem);line-height:.92;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1.brand em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%);padding:0 .05em}
.intro{max-width:62ch;font-size:1.125rem;color:var(--ink);margin:0}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;color:var(--muted)}
.byline strong{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.55rem .95rem;border-radius:2px;
  font-weight:500;text-decoration:none;cursor:pointer;font-size:.9375rem}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.solid:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--rule)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.danger:hover{background:var(--warn);color:var(--paper)}
.stamp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ink);max-width:560px;background:var(--sheet)}
.stamp div{padding:.6rem .8rem;border-right:1px solid var(--ink);min-width:0}
.stamp div:last-child{border-right:0}
.stamp b{display:block;font-family:var(--f-display);font-stretch:110%;font-variation-settings:"wdth" 110;font-size:1.75rem;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.stamp small{color:var(--muted)}

/* Barra de filtros */
.tools{padding-block:1.75rem 1rem;display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between}
.search{flex:1 1 260px;max-width:380px;position:relative}
.search input{width:100%;padding:.65rem .9rem .65rem 2.3rem;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--rule);background:transparent;padding:.35rem .75rem;border-radius:999px;cursor:pointer;font-size:.875rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]:hover{color:var(--paper)}

/* Pranchas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1.25rem;padding-bottom:3rem}
.sheet{background:var(--sheet);border:1px solid var(--rule);display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;min-width:0}
.sheet:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:6px 6px 0 var(--line)}
.sheet.feat{border-color:var(--ink)}
.draw{aspect-ratio:16/8;max-width:100%;border-bottom:1px solid var(--rule);display:block;width:100%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16px 16px}
.draw svg{width:100%;height:100%;display:block}
.body{padding:1.1rem 1.15rem 1rem;display:grid;gap:.6rem;flex:1;align-content:start}
.cat{color:var(--accent)}
.sheet h3{font-family:var(--f-display);font-stretch:108%;font-variation-settings:"wdth" 108;font-weight:720;font-size:1.4rem;line-height:1.15;margin:0;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:.15rem .45rem;border:1px solid var(--rule);color:var(--ink);border-radius:2px}
.titleblock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.titleblock span{padding:.5rem .8rem;border-right:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titleblock span:last-child{border-right:0}
.status{display:inline-flex;align-items:center;gap:.4rem}
.status::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:currentColor}
.s-uso{color:var(--ok)} .s-dev{color:var(--warn)} .s-ideia{color:var(--idea)}
.empty{border:1px dashed var(--rule);padding:2.5rem 1.5rem;text-align:center;color:var(--muted);grid-column:1/-1}

/* Rodapé */
footer{border-top:1px solid var(--rule);padding-block:1.5rem 2.5rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem}

/* Detalhe */
dialog{border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 32px);border-radius:2px}
dialog::backdrop{background:rgba(5,14,35,.55)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1}
.x{border:0;background:transparent;cursor:pointer;font-size:1.5rem;line-height:1;padding:.25rem .5rem;color:var(--ink)}
.dbody{padding:1.25rem 1.5rem 1.5rem;display:grid;gap:1.1rem}
.dbody h2{font-family:var(--f-display);font-stretch:115%;font-variation-settings:"wdth" 115;font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.02;margin:0;text-wrap:balance}
.lead{font-size:1.1rem;margin:0;max-width:62ch}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--rule)}
.spec div{padding:.6rem .8rem;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.spec small{display:block;color:var(--muted)}
.sec h4{margin:0 0 .3rem;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.sec p{margin:0;max-width:65ch;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}

/* Edição (só dono/editores) */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
  padding:.7rem max(16px,env(safe-area-inset-right,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.editbar .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.editbar .btn{border-color:var(--paper);color:var(--paper)}
.editbar .btn:hover{background:var(--paper);color:var(--ink)}
.editbar .btn.solid{background:var(--mark);border-color:var(--mark);color:#1A1200}
.editbar .msg{font-size:.9rem}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:4px 4px 0 var(--line)}
body.editing{padding-bottom:5rem}
.rowtools{display:flex;gap:.3rem;padding:.5rem .8rem;border-top:1px solid var(--rule);background:var(--paper);flex-wrap:wrap}
.rowtools .btn{padding:.3rem .6rem;font-size:.8rem}
form.ed{display:grid;gap:.9rem}
form.ed .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem}
form.ed label{display:grid;gap:.3rem;font-size:.85rem;color:var(--muted);min-width:0}
form.ed input,form.ed select,form.ed textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--rule);background:var(--paper);border-radius:2px;color:var(--ink)}
form.ed textarea{min-height:5.5rem;resize:vertical}
form.ed .check{display:flex;align-items:center;gap:.5rem;color:var(--ink)}
form.ed .check input{width:auto}
.hint{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));background:var(--mark);color:#1A1200;padding:.55rem 1rem;z-index:30;font-weight:500;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.stamp b{font-size:1.35rem}.dbody{padding:1rem}}

    '<h1 class="brand">'+brandHtml+'</h1>'+
    '<p class="intro">'+esc(state.intro)+'</p>'+
    '<div class="byline">'+(state.author?'<span>por <strong>'+esc(state.author)+'</strong>'+(state.role?' · '+esc(state.role):'')+'</span>':(state.role?'<span>'+esc(state.role)+'</span>':''))+
      (li?'<a class="btn" href="'+esc(li)+'" target="_blank" rel="noopener">LinkedIn ↗</a>':'')+'</div>'+
    '<div class="stamp mono"><div><small>Projetos</small><b>'+P.length+'</b></div><div><small>Em uso</small><b>'+emUso+'</b></div><div><small>Ferramentas</small><b>'+allTools().length+'</b></div></div>'+
  '</div></header>';
  h+='<main class="wrap"><div class="tools"><label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>'+
    '<input id="q" type="search" placeholder="Buscar por nome, ferramenta ou tema" aria-label="Buscar projetos" value="'+esc(ui.q)+'"></label>'+
    '<div class="chips" role="group" aria-label="Filtrar por área">'+["Todos"].concat(cats()).map(function(c){return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+esc(c)+'</button>'}).join("")+'</div></div>';
  h+='<section class="grid" id="grid" aria-label="Projetos"></section></main>';
  h+='<footer><div class="wrap mono"><span>'+esc(state.brand)+' · '+P.length+' pranchas</span><span>Construído com Claude</span></div></footer>';
  app.innerHTML=h;
  renderGrid();
  var q=document.getElementById("q");
  q.addEventListener("input",function(){ui.q=q.value;renderGrid()});
  app.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){ui.cat=b.getAttribute("data-cat");app.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});renderGrid()})});
  renderEditChrome();
}

function renderGrid(){
  var g=document.getElementById("grid"),list=visible();
  if(!state.projects.length){g.innerHTML='<div class="empty">Nenhum projeto ainda.'+(ui.editing?' Use “Novo projeto” para adicionar o primeiro.':'')+'</div>';return}
  if(!list.length){g.innerHTML='<div class="empty">Nenhum projeto encontrado para essa busca.</div>';return}
  g.innerHTML=list.map(function(o){var p=o.p,i=o.i;
    return '<article class="sheet'+(p.featured?' feat':'')+'" data-id="'+esc(p.id)+'" tabindex="0" role="button" aria-label="Abrir '+esc(p.title)+'">'+
      '<div class="draw">'+drawing(p,i)+'</div>'+
      '<div class="body"><span class="cat mono">'+esc(p.category)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p>'+
      '<div class="tags">'+(p.tools||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div></div>'+
      '<div class="titleblock"><span>PR-'+num(i)+'</span><span class="status '+stClass(p.status)+'">'+esc(p.status)+'</span><span>'+esc(p.year||"—")+'</span></div>'+
      (ui.editing?'<div class="rowtools" data-stop><button class="btn ghost" data-act="edit" data-i="'+i+'">Editar</button><button class="btn ghost" data-act="up" data-i="'+i+'" aria-label="Mover para antes">↑</button><button class="btn ghost" data-act="down" data-i="'+i+'" aria-label="Mover para depois">↓</button><button class="btn danger" data-act="del" data-i="'+i+'">Excluir</button></div>':'')+
    '</article>'}).join("");
  g.querySelectorAll(".sheet").forEach(function(c){
    c.addEventListener("click",function(e){if(e.target.closest("[data-stop]"))return;location.hash=c.getAttribute("data-id")});
    c.addEventListener("keydown",function(e){if(e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();location.hash=c.getAttribute("data-id")}});
  });
  g.querySelectorAll("[data-act]").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();rowAction(b.getAttribute("data-act"),+b.getAttribute("data-i"))})});
}

/* Detalhe do projeto (#id) */
function openDetail(id){
  var i=-1;state.projects.forEach(function(p,k){if(p.id===id)i=k});
  if(i<0){if(dlg.open)dlg.close();return}
  var p=state.projects[i],link=safeUrl(p.link);
  var share=safeUrl(state.siteUrl)?safeUrl(state.siteUrl).replace(/#.*$/,"")+"#"+p.id:"";
  function sec(t,v){return v?'<div class="sec"><h4>'+t+'</h4><p>'+esc(v)+'</p></div>':''}
  dlg.innerHTML='<div class="dhead"><span class="mono">Prancha PR-'+num(i)+' · '+esc(p.category)+'</span><button class="x" id="dclose" aria-label="Fechar">×</button></div>'+
    '<div class="dbody"><div class="draw">'+drawing(p,i)+'</div><h2 id="dlg-title">'+esc(p.title)+'</h2><p class="lead">'+esc(p.summary)+'</p>'+
    '<div class="spec mono"><div><small>Status</small><span class="status '+stClass(p.status)+'">'+esc(p.status)+'</span></div><div><small>Ano</small>'+esc(p.year||"—")+'</div><div><small>Ferramentas</small>'+esc((p.tools||[]).join(", ")||"—")+'</div></div>'+
    sec("O problema",p.problem)+sec("O que a solução faz",p.solution)+sec("Resultado",p.impact)+
    '<div class="actions">'+(link?'<a class="btn solid" href="'+esc(link)+'" target="_blank" rel="noopener">Ver projeto ↗</a>':'')+
      (share?'<button class="btn" id="dcopy">Copiar link desta prancha</button>':'')+
      (ui.editing?'<button class="btn ghost" id="dedit">Editar</button>':'')+'</div>'+
    (share?'<p class="hint" id="dlinktxt" hidden>'+esc(share)+'</p>':'')+'</div>';
  document.getElementById("dclose").onclick=closeDetail;
  var cp=document.getElementById("dcopy");
  if(cp)cp.onclick=function(){var t=document.getElementById("dlinktxt");
    var done=function(){toast("Link copiado")},fail=function(){t.hidden=false;var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selecione e copie o link abaixo")};
    try{navigator.clipboard.writeText(share).then(done,fail)}catch(e){fail()}};
  var de=document.getElementById("dedit");if(de)de.onclick=function(){openEditor(i)};
  if(!dlg.open)dlg.showModal();
  dlg.scrollTop=0;
}
function closeDetail(){if(dlg.open)dlg.close();if(location.hash)location.hash=""}
dlg.addEventListener("cancel",function(e){e.preventDefault();closeDetail()});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDetail()});
function route(){var id=location.hash.replace(/^#/,"");if(id)openDetail(id);else if(dlg.open)dlg.close()}
window.addEventListener("hashchange",route);

/* ---------- Modo edição ---------- */
var toastT;
function toast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

function renderEditChrome(){
  var old=document.getElementById("editchrome");if(old)old.remove();
  document.body.classList.toggle("editing",ui.editing);
  if(!ui.canEdit)return;
  var d=document.createElement("div");d.id="editchrome";
  if(!ui.editing){d.innerHTML='<button class="btn solid fab" id="enterEdit">Editar acervo</button>'}
  else{d.innerHTML='<div class="editbar"><div class="in"><span class="msg">'+(ui.dirty?'Alterações ainda não publicadas':'Modo edição · só você vê esta barra')+'</span>'+
    '<div class="actions"><button class="btn" id="newP">Novo projeto</button><button class="btn" id="prof">Perfil e textos</button>'+
    '<button class="btn solid" id="pub"'+(ui.dirty?'':' disabled')+'>Publicar</button><button class="btn" id="exitEdit">Sair</button></div></div></div>'}
  document.body.appendChild(d);
  var b;
  if((b=document.getElementById("enterEdit")))b.onclick=function(){ui.editing=true;render()};
  if((b=document.getElementById("exitEdit")))b.onclick=function(){if(ui.dirty){toast("Publique antes de sair, ou recarregue a página para descartar");return}ui.editing=false;render()};
  if((b=document.getElementById("newP")))b.onclick=function(){openEditor(-1)};
  if((b=document.getElementById("prof")))b.onclick=openProfile;
  if((b=document.getElementById("pub")))b.onclick=publish;
}
function markDirty(){ui.dirty=true;var t=new Date();state.updatedAt=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");try{sessionStorage.setItem("usina-draft",JSON.stringify(state))}catch(e){}render()}

function rowAction(a,i){
  var P=state.projects;
  if(a==="edit")return openEditor(i);
  if(a==="up"&&i>0){P.splice(i-1,0,P.splice(i,1)[0]);return markDirty()}
  if(a==="down"&&i<P.length-1){P.splice(i+1,0,P.splice(i,1)[0]);return markDirty()}
  if(a==="del"){
    dlg.innerHTML='<div class="dhead"><span class="mono">Excluir prancha</span><button class="x" id="dclose" aria-label="Fechar">×</button></div><div class="dbody"><p class="lead">Excluir “'+esc(P[i].title)+'” do acervo? A mudança só vai ao ar quando você publicar.</p><div class="actions"><button class="btn danger" id="yes">Excluir</button><button class="btn ghost" id="no">Cancelar</button></div></div>';
    document.getElementById("dclose").onclick=document.getElementById("no").onclick=function(){dlg.close()};
    document.getElementById("yes").onclick=function(){P.splice(i,1);dlg.close();markDirty()};
    if(!dlg.open)dlg.showModal();
  }
}

function field(id,label,val,type,extra){
  if(type==="area")return '<label for="'+id+'">'+label+'<textarea id="'+id+'" name="'+id+'">'+esc(val)+'</textarea>'+(extra||"")+'</label>';
  return '<label for="'+id+'">'+label+'<input id="'+id+'" name="'+id+'" type="'+(type||"text")+'" value="'+esc(val)+'"'+(type==="url"?' placeholder="https://"':'')+'>'+(extra||"")+'</label>';
}

function openEditor(i){
  var isNew=i<0,p=isNew?{id:"",title:"",category:cats()[0]||"",status:"Em desenvolvimento",year:String(new Date().getFullYear()),summary:"",problem:"",solution:"",impact:"",tools:[],link:"",featured:false}:state.projects[i];
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
  dlg.innerHTML='<div class="dhead"><span class="mono">'+(isNew?'Nova prancha':'Editar PR-'+num(i))+'</span><button class="x" id="dclose" aria-label="Fechar">×</button></div>'+
  '<div class="dbody"><form class="ed" id="pf">'+
    field("f-title","Nome do projeto *",p.title)+
    '<div class="two">'+field("f-cat","Área",p.category,"text",'<datalist id="catlist">'+cats().map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist>')+
      '<label for="f-status">Status<select id="f-status">'+STATUSES.map(function(s){return '<option'+(s===p.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></label>'+
      field("f-year","Ano",p.year)+'</div>'+
    field("f-summary","Resumo (aparece no cartão) *",p.summary,"area")+
    field("f-problem","O problema",p.problem,"area")+
    field("f-solution","O que a solução faz",p.solution,"area")+
    field("f-impact","Resultado (horas poupadas, erros evitados, quem usa)",p.impact,"area")+
    field("f-tools","Ferramentas, separadas por vírgula",(p.tools||[]).join(", "))+
    field("f-link","Link do projeto (GitHub, vídeo, demo)",p.link,"url",'<span class="hint">Só links que começam com https:// aparecem.</span>')+
    '<label class="check" for="f-feat"><input type="checkbox" id="f-feat"'+(p.featured?' checked':'')+'> Marcar como destaque</label>'+
    '<div class="actions"><button class="btn solid" type="submit">'+(isNew?'Adicionar ao acervo':'Salvar prancha')+'</button><button class="btn ghost" type="button" id="cancel">Cancelar</button></div>'+
    '<p class="hint">Salvar aqui atualiza a sua tela. Para o link público mudar, use “Publicar” na barra de baixo.</p>'+
  '</form></div>';
  document.getElementById("f-cat").setAttribute("list","catlist");
  document.getElementById("dclose").onclick=document.getElementById("cancel").onclick=function(){dlg.close()};
  document.getElementById("pf").addEventListener("submit",function(e){
    e.preventDefault();
    var g=function(id){return document.getElementById(id).value.trim()};
    if(!g("f-title")||!g("f-summary")){toast("Preencha o nome e o resumo");return}
    var n={id:p.id,title:g("f-title"),category:g("f-cat")||"Outros",status:document.getElementById("f-status").value,year:g("f-year"),
      summary:g("f-summary"),problem:g("f-problem"),solution:g("f-solution"),impact:g("f-impact"),
      tools:g("f-tools").split(",").map(function(t){return t.trim()}).filter(Boolean),link:g("f-link"),featured:document.getElementById("f-feat").checked};
    if(!n.id){var base=slug(n.title),id=base,k=2;while(state.projects.some(function(x){return x.id===id}))id=base+"-"+(k++);n.id=id}
    if(isNew)state.projects.unshift(n);else state.projects[i]=n;
    dlg.close();markDirty();toast(isNew?"Prancha adicionada":"Prancha salva");
  });
  if(!dlg.open)dlg.showModal();dlg.scrollTop=0;
}

function openProfile(){
  dlg.innerHTML='<div class="dhead"><span class="mono">Perfil e textos</span><button class="x" id="dclose" aria-label="Fechar">×</button></div>'+
  '<div class="dbody"><form class="ed" id="prf">'+
    field("p-brand","Nome do acervo",state.brand,"text",'<span class="hint">A última palavra ganha o grifo amarelo.</span>')+
    '<div class="two">'+field("p-author","Seu nome",state.author)+field("p-role","Cargo ou área",state.role)+'</div>'+
    field("p-intro","Texto de apresentação",state.intro,"area")+
    field("p-li","Seu perfil no LinkedIn",state.linkedin,"url")+
    field("p-site","Link público deste acervo",state.siteUrl,"url",'<span class="hint">O endereço claude.ai/… desta página. Habilita o botão “Copiar link desta prancha”.</span>')+
    '<div class="actions"><button class="btn solid" type="submit">Salvar</button><button class="btn ghost" type="button" id="cancel">Cancelar</button></div>'+
  '</form></div>';
  document.getElementById("dclose").onclick=document.getElementById("cancel").onclick=function(){dlg.close()};
  document.getElementById("prf").addEventListener("submit",function(e){
    e.preventDefault();var g=function(id){return document.getElementById(id).value.trim()};
    state.brand=g("p-brand")||"Usina de Ideias";state.author=g("p-author");state.role=g("p-role");state.intro=g("p-intro");state.linkedin=g("p-li");state.siteUrl=g("p-site");
    dlg.close();markDirty();toast("Perfil salvo");
  });
  if(!dlg.open)dlg.showModal();
}

function buildDoc(){
  var css=document.getElementById("css").textContent, main=document.getElementById("main").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return SKEL_START+'<title>'+esc(state.brand)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">\n'+
    '<style id="css">'+css+'<\/style>\n<div id="app"></div>\n<dialog id="dlg" aria-labelledby="dlg-title"></dialog>\n'+
    '<script type="application/json" id="data">'+json+'<\/script>\n<script id="main">'+main+'<\/script></body></html>';
}

function publish(){
  if(!ui.art){toast("Publicação indisponível nesta visualização");return}
  var b=document.getElementById("pub");if(b){b.disabled=true;b.textContent="Publicando…"}
  ui.art.publish(buildDoc()).then(function(){try{sessionStorage.removeItem("usina-draft")}catch(e){}},function(err){
    var c=err&&err.code;
    if(c==="conflict"){toast("Uma versão mais nova foi publicada. A página vai recarregar.");return}
    if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"){ui.canEdit=false;ui.editing=false;render();toast("Esta visualização é só leitura");return}
    if(c==="rate_limited"){toast("Muitas publicações seguidas. Tente de novo em alguns minutos.")}
    else toast("Não foi possível publicar agora. Tente de novo.");
    if(b){b.disabled=false;b.textContent="Publicar"}
  });
}

/* Recupera rascunho não publicado (mesma aba) */
try{var dr=sessionStorage.getItem("usina-draft");if(dr){var ds=JSON.parse(dr);if(ds&&Array.isArray(ds.projects)&&JSON.stringify(ds)!==JSON.stringify(state)){state=ds;ui.dirty=true;ui.editing=true}}}catch(e){}

render();route();

if(window.claude&&claude.use){
  Promise.all([claude.use("artifact"),claude.use("user")]).then(function(r){
    ui.art=r[0];var u=r[1];
    return u?u.canEdit():false;
  }).then(function(ok){ui.canEdit=!!(ok&&ui.art);if(!ui.canEdit){ui.editing=false;ui.dirty=false}render()}).catch(function(){});
}
})();
</script>

</body></html>
