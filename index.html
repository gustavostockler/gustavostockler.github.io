<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Usina de Ideias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Projetos de FP&A e controladoria construídos com IA por Gustavo Stockler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: o acervo é um demonstrativo. Hero em papel pautado com barra de fórmula; projetos agrupados como plano de contas; detalhe como nota explicativa; total com sublinhado duplo contábil. */
:root{
  --paper:#F3F6F1; --sheet:#FFFFFF; --ink:#15231C; --muted:#5A6A61; --grid:#D7E1D8; --rule:#B9C8BC;
  --green:#1D6A43; --green-soft:rgba(29,106,67,.09); --red:#B4392A; --amber:#9A6200; --on-green:#FFFFFF;
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1611; --sheet:#121F18; --ink:#E3EDE6; --muted:#93A69A; --grid:#22342A; --rule:#34493D;
  --green:#5DC38B; --green-soft:rgba(93,195,139,.10); --red:#E2705F; --amber:#E2AA4C; --on-green:#0D1611; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1611; --sheet:#121F18; --ink:#E3EDE6; --muted:#93A69A; --grid:#22342A; --rule:#34493D;
  --green:#5DC38B; --green-soft:rgba(93,195,139,.10); --red:#E2705F; --amber:#E2AA4C; --on-green:#0D1611; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Hero: papel pautado com margem vermelha dupla */
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 2.5rem);padding-bottom:3rem;position:relative;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--grid) 31px,var(--grid) 32px),var(--paper);border-bottom:1px solid var(--rule)}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:max(10px,calc(50% - 584px));width:6px;border-left:1px solid var(--red);border-right:1px solid var(--red);opacity:.55}
.hero .wrap{display:grid;gap:1.75rem;position:relative}
.fx{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:stretch;background:var(--sheet);border:1px solid var(--rule);max-width:760px;font-family:var(--f-code);font-size:.9rem}
.fx .ref{padding:.55rem .8rem;border-right:1px solid var(--rule);color:var(--muted);min-width:4.2rem}
.fx .fn{padding:.55rem .7rem;border-right:1px solid var(--rule);color:var(--muted);font-style:italic}
.fx .formula{padding:.55rem .8rem;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.fx .formula::-webkit-scrollbar{display:none}
.fx .k{color:var(--green);font-weight:500}.fx .s{color:var(--amber)}
.caret{display:inline-block;width:1px;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1.brand{font-family:var(--f-display);font-weight:780;font-variation-settings:"wdth" 78,"opsz" 96;font-stretch:78%;
  font-size:clamp(3rem,11vw,8.25rem);line-height:.86;letter-spacing:-.035em;margin:0;text-wrap:balance}
.lede{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem 3rem;align-items:end}
.intro{max-width:58ch;font-size:1.15rem;line-height:1.6;margin:0}
.who{display:grid;gap:.75rem;justify-items:start}
.who p{margin:0;color:var(--muted)}
.who strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:650;font-size:1.35rem;font-variation-settings:"wdth" 90;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.55rem 1rem;border-radius:3px;
  font-weight:600;text-decoration:none;cursor:pointer;font-size:.9375rem}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.1);background:var(--green);color:var(--on-green)}
.btn.quiet{border-color:var(--rule)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:var(--sheet)}
.btn svg{flex:none}

/* Abas de planilha como filtro */
.sheetbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;padding-top:2.5rem}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule);min-width:0}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:.55rem 1rem;cursor:pointer;color:var(--muted);font-weight:500;font-size:.925rem;margin-bottom:-1px;border-radius:4px 4px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sheet);border-color:var(--rule);color:var(--green);font-weight:650;box-shadow:inset 0 -2px 0 var(--green)}
.search{position:relative;flex:0 1 300px;min-width:0}
.search input{width:100%;padding:.55rem .8rem .55rem 2.2rem;border:1px solid var(--rule);background:var(--sheet);border-radius:3px}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Demonstrativo */
.ledger{background:var(--sheet);border:1px solid var(--rule);border-top:0;margin-bottom:3.5rem;overflow:hidden}
.row{display:grid;grid-template-columns:4.75rem 15.5rem minmax(0,1fr) 9.5rem;align-items:start;border-bottom:1px solid var(--grid)}
.thumb{padding-right:0!important}
.shot{display:block;position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper);
  box-shadow:3px 3px 0 var(--grid);transition:transform .2s ease,box-shadow .2s ease}
.shot img,.shot svg{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.shot .tagline{position:absolute;left:6px;bottom:6px;font-size:.68rem;font-weight:600;padding:.05rem .4rem;border-radius:2px;background:var(--sheet);color:var(--muted);border:1px solid var(--grid)}
.shot .tagline.live{color:var(--green);border-color:var(--green)}
.item:hover .shot,.item:focus-visible .shot{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--green)}
.dshot{aspect-ratio:16/10;max-width:100%;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper)}
.dshot img,.dshot svg{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.group > *:nth-child(2){grid-column:2/-1}
.ttl .tools{display:flex;flex-wrap:wrap;gap:.3rem;padding:.35rem 0 0!important}
.row > *{padding:.95rem .9rem;min-width:0}
.head{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--paper);border-bottom:1px solid var(--rule)}
.head > *{padding-block:.6rem}
.num{text-align:right}
.group{background:var(--green-soft);font-weight:650;color:var(--ink);border-bottom:1px solid var(--grid)}
.group > *{padding-block:.55rem}
.group .count{color:var(--muted);font-weight:500}
.item{cursor:pointer;position:relative;outline:0}
.item:hover,.item:focus-visible{background:var(--green-soft)}
.item:hover::after,.item:focus-visible::after{content:"";position:absolute;inset:-1px;border:2px solid var(--green);pointer-events:none}
.code{font-family:var(--f-code);font-size:.85rem;color:var(--muted);padding-top:1.15rem!important}
.ttl{display:grid;gap:.3rem}
.ttl h3{margin:0;font-family:var(--f-display);font-weight:680;font-variation-settings:"wdth" 92;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.ttl h3 .star{color:var(--amber);margin-left:.35rem;font-size:.9em}
.ttl p{margin:0;color:var(--muted);font-size:.95rem;max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:.3rem;padding-top:1.1rem!important}
.tool{font-size:.78rem;padding:.12rem .45rem;border:1px solid var(--grid);border-radius:3px;color:var(--ink);background:var(--paper)}
.st{font-size:.875rem;font-weight:600;display:inline-flex;align-items:center;gap:.45rem;padding-top:1.15rem!important}
.st i{width:.6rem;height:.6rem;display:inline-block;flex:none}
.s-uso{color:var(--green)} .s-uso i{background:currentColor;border-radius:50%}
.s-dev{color:var(--amber)} .s-dev i{border:2px solid currentColor;border-radius:50%}
.s-ideia{color:var(--muted)} .s-ideia i{border:2px dashed currentColor;border-radius:50%}
.yr{color:var(--muted);padding-top:1.15rem!important}
.total{font-weight:700;border-bottom:0;background:var(--sheet)}
.total > *{padding-block:1rem 1.1rem}
.total .sum{border-top:1px solid var(--ink);border-bottom:4px double var(--ink);padding-block:.45rem;display:inline-block}
.empty{padding:2.5rem 1.25rem;text-align:center;color:var(--muted)}

footer{border-top:1px solid var(--rule);padding-block:1.5rem 2.5rem;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem}

/* Nota explicativa */
dialog{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 32px);border-radius:4px;box-shadow:0 24px 60px rgba(8,20,14,.28)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(8,20,14,.5)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem .75rem .6rem 1.5rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1}
.dhead span{font-family:var(--f-code);font-size:.85rem;color:var(--muted)}
.x{border:0;background:transparent;cursor:pointer;font-size:1.6rem;line-height:1;padding:.2rem .55rem;color:var(--ink);border-radius:3px}
.x:hover{background:var(--green-soft)}
.dbody{padding:1.5rem 1.5rem 1.75rem;display:grid;gap:1.25rem}
.dbody h2{font-family:var(--f-display);font-weight:760;font-variation-settings:"wdth" 82,"opsz" 72;font-size:clamp(2rem,6vw,3rem);line-height:.98;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:1.1rem;margin:0;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--grid)}
.facts div{padding:.65rem .75rem .7rem 0;min-width:0}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.note h4{margin:0 0 .3rem;font-family:var(--f-display);font-weight:650;font-variation-settings:"wdth" 95;font-size:1.05rem;color:var(--green)}
.note p{margin:0;max-width:62ch;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* Edição (só no Claude, para o dono) */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
  padding:.7rem max(16px,env(safe-area-inset-right,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.editbar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.editbar .btn{border-color:var(--paper);color:var(--paper)}
.editbar .btn:hover{background:var(--paper);color:var(--ink)}
.editbar .btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
body.editing{padding-bottom:5rem}
.rowtools{grid-column:1/-1;display:flex;gap:.3rem;flex-wrap:wrap;padding:.1rem .9rem .9rem 6.4rem!important}
.rowtools .btn{padding:.25rem .6rem;font-size:.8rem}
form.ed{display:grid;gap:.9rem}
form.ed .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem}
form.ed label{display:grid;gap:.3rem;font-size:.875rem;color:var(--muted);min-width:0}
form.ed input,form.ed select,form.ed textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--rule);background:var(--paper);border-radius:3px;color:var(--ink)}
form.ed textarea{min-height:5.5rem;resize:vertical}
form.ed .check{display:flex;align-items:center;gap:.5rem;color:var(--ink)}
form.ed .check input{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:3px;z-index:30;font-weight:500;max-width:calc(100vw - 32px)}

@media (max-width:860px){
  .lede{grid-template-columns:1fr}
  .row{grid-template-columns:4.25rem 11rem minmax(0,1fr)}
  .row .st{grid-column:3;grid-row:1;padding-bottom:0!important}
  .row.item .ttl{grid-column:3;grid-row:2;padding-top:.3rem!important}
  .row.item .thumb{grid-column:2;grid-row:1/3}
  .row.item .code{grid-row:1/3}
  .head .h-st{display:none}
  .total{grid-template-columns:minmax(0,1fr) auto}
  .total > *:first-child,.total > *:nth-child(2){display:none}
  .rowtools{padding-left:.9rem!important}
}
@media (max-width:560px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row.item .code{grid-column:1/2;grid-row:1;padding-bottom:0!important;padding-top:.8rem!important}
  .row .st{grid-column:2/3;grid-row:1;padding-top:.8rem!important;padding-bottom:0!important}
  .row.item .thumb{grid-column:1/-1;grid-row:2;padding:.6rem .9rem 0!important}
  .row.item .ttl{grid-column:1/-1;grid-row:3;padding-top:.6rem!important}
  .hero::before{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
  .tab{white-space:nowrap}
  .head{display:none}
  .group > *:first-child{display:none}
  .total > *:first-child,.total > *:nth-child(2){display:none}
  .total{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .dbody{padding:1.1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function typeFormula(){

function matches(p){
  if(ui.cat!=="Todos"&&(p.category||"Outros")!==ui.cat)return false;
  var q=ui.q.trim().toLowerCase();if(!q)return true;
  return [p.title,p.summary,p.category,p.problem,p.solution,(p.tools||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>=0;
}

    h+='<div class="row group"><span class="code">'+(gi+1)+'</span><span>'+esc(g)+' <span class="count">('+items.length+')</span></span></div>';
    items.forEach(function(o){var p=o.p;shown.push(p);

  var uso=shown.filter(function(p){return p.status==="Em uso"}).length;

  });
  L.querySelectorAll("[data-act]").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();rowAction(b.getAttribute("data-act"),+b.getAttribute("data-i"))})});

  document.body.appendChild(d);

function markDirty(){ui.dirty=true;var t=new Date();state.updatedAt=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");try{sessionStorage.setItem("usina-draft",JSON.stringify(state))}catch(e){}render()}

function rowAction(a,i){
  var P=state.projects;
  if(a==="edit")return openEditor(i);
  if(a==="up"&&i>0){P.splice(i-1,0,P.splice(i,1)[0]);return markDirty()}
  if(a==="down"&&i<P.length-1){P.splice(i+1,0,P.splice(i,1)[0]);return markDirty()}
  if(a==="del"){
    dlg.innerHTML='<div class="dhead"><span>Excluir projeto</span><button class="x" id="dclose" aria-label="Fechar">×</button></div><div class="dbody"><p class="lead">Excluir “'+esc(P[i].title)+'” do acervo? A mudança só vai ao ar quando você publicar.</p><div class="actions"><button class="btn danger" id="yes">Excluir</button><button class="btn quiet" id="no">Cancelar</button></div></div>';
    document.getElementById("dclose").onclick=document.getElementById("no").onclick=function(){dlg.close()};
    document.getElementById("yes").onclick=function(){P.splice(i,1);dlg.close();markDirty()};
    if(!dlg.open)dlg.showModal();
  }
}

function publish(){
  if(!ui.art){toast("Publicação indisponível nesta visualização");return}
  var b=document.getElementById("pub");if(b){b.disabled=true;b.textContent="Publicando…"}
  ui.art.publish(buildDoc()).then(function(){try{sessionStorage.removeItem("usina-draft")}catch(e){}},function(err){
    var c=err&&err.code;
    if(c==="conflict"){toast("Uma versão mais nova foi publicada. A página vai recarregar.");return}
    if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"){ui.canEdit=false;ui.editing=false;render();toast("Esta visualização é só leitura");return}
    toast(c==="rate_limited"?"Muitas publicações seguidas. Tente de novo em alguns minutos.":"Não foi possível publicar agora. Tente de novo.");
    if(b){b.disabled=false;b.textContent="Publicar"}
  });
}

try{var dr=sessionStorage.getItem("usina-draft");if(dr){var ds=JSON.parse(dr);if(ds&&Array.isArray(ds.projects)&&JSON.stringify(ds)!==JSON.stringify(state)){state=ds;ui.dirty=true;ui.editing=true}}}catch(e){}

render();route();

if(window.claude&&claude.use){
  Promise.all([claude.use("artifact"),claude.use("user")]).then(function(r){
    ui.art=r[0];var u=r[1];return u?u.canEdit():false;
  }).then(function(ok){ui.canEdit=!!(ok&&ui.art);if(!ui.canEdit){ui.editing=false;ui.dirty=false}render()}).catch(function(){});
}
})();
</script>

</body></html>
