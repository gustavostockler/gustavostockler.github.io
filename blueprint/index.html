<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--panel:#ffffff;--panel2:#f6f8fb;--line:#dde3ec;--txt:#1d2433;--muted:#667085;
  --acc:#2f5bd3;--acc2:#1f3f9a;--accbg:#e8eefc;--ok:#13795b;--okbg:#e3f5ee;--warn:#9a6700;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fde8e6;
  --desk:#c9d0db;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
  /* papel (sempre claro: é a página do Word) */
  --pg-blue:#4472C4;--pg-blue2:#2E74B5;--pg-head:#B4C6E7;--pg-th:#D9D9D9;--pg-txt:#404040;--pg-muted:#595959;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f;--panel:#1a202b;--panel2:#202836;--line:#2d3646;--txt:#e6eaf2;--muted:#98a2b3;--acc:#7c9cff;--acc2:#a9bcff;--accbg:#232e4a;
  --ok:#5fd4a8;--okbg:#173328;--warn:#f5c451;--warnbg:#3a3018;--bad:#ff8a80;--badbg:#3d1c1a;--desk:#0c0f15;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#12161f;--panel:#1a202b;--panel2:#202836;--line:#2d3646;--txt:#e6eaf2;--muted:#98a2b3;--acc:#7c9cff;--acc2:#a9bcff;--accbg:#232e4a;
  --ok:#5fd4a8;--okbg:#173328;--warn:#f5c451;--warnbg:#3a3018;--bad:#ff8a80;--badbg:#3d1c1a;--desk:#0c0f15;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4b7bf5,#152a6e);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.doc-id{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.doc-id b{color:var(--txt);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.rasc{background:var(--warnbg);color:var(--warn)}
.chip.fin{background:var(--okbg);color:var(--ok)}
.chip.rev{background:var(--accbg);color:var(--acc)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.sec-h:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sep{width:1px;height:24px;background:var(--line)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:40}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop small{display:block;color:var(--muted);font-size:11.5px}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--accbg);color:var(--txt);border-bottom:1px solid var(--line);font-size:13px}
.banner b{color:var(--acc)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(330px,420px) 1fr;height:calc(100vh - 50px)}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 12px 40px}
.view{position:relative;overflow:auto;background:var(--desk)}
.mobtabs{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .side,.view{min-height:calc(100vh - 140px)}
  body[data-mob="pag"] .side{display:none}
  body[data-mob="ed"] .view{display:none}
  .mobtabs{display:flex;gap:6px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mobtabs .btn{flex:1;justify-content:center}
  .mobtabs .btn[aria-pressed="true"]{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
  .top{padding:8px 16px}
}

/* ---------- editor lateral ---------- */
.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:6px 2px 8px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;font-size:13.5px}
.sec-h .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--panel2);color:var(--muted);font-size:11px;flex:none}
.sec-h .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.sec-h .pd{background:var(--warnbg);color:var(--warn);border-radius:999px;padding:0 7px;font-size:11px;font-weight:600}
.sec-h::after{content:"▸";color:var(--muted);transition:transform .15s}
.sec.open .sec-h::after{transform:rotate(90deg)}
.sec-b{padding:4px 11px 12px;display:none}
.sec.open .sec-b{display:block}
.sec.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:none}}
.fld{display:block;margin:8px 0}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld input[type=text],.fld textarea,.te input,.te textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 8px}
.fld textarea{min-height:54px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.te{width:100%;border-collapse:separate;border-spacing:0 4px}
.te th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:0 3px}
.te td{vertical-align:top;padding:0 2px}
.te textarea{min-height:32px;resize:vertical;font-size:13px;padding:5px 7px}
.te input{font-size:13px;padding:5px 7px}
.te .ops{white-space:nowrap;width:1%}
.ib{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px 4px;border-radius:5px;font-size:13px;line-height:1}
.ib:hover{background:var(--panel2);color:var(--txt)}
.ib.del:hover{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin:6px 0}
.extra{border:1px dashed var(--line);border-radius:8px;padding:8px;margin:8px 0}

/* ---------- área de páginas ---------- */
.vbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);font-size:13px}
.vbar .grow{flex:1}
.vbar select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 6px;max-width:220px}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tog input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:.15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked{background:var(--acc)}
.tog input:checked::after{left:16px}
.pages{padding:22px 0 60px;display:flex;flex-direction:column;align-items:center;gap:22px;zoom:var(--z,1)}
.pgwrap{position:relative}
.pglbl{position:absolute;left:-46px;top:4px;font-size:11px;color:var(--muted)}

/* ---------- página (papel A4: 794 x 1123 px a 96 dpi) ---------- */
.page{width:794px;height:1123px;background:#fff;color:var(--pg-txt);box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;overflow:hidden;
  font:10.5px/1.5 "Open Sans","Segoe UI",Arial,sans-serif}
.page .hdr{position:absolute;left:72px;right:72px;top:34px;display:flex;justify-content:space-between;font-size:8.5px;color:var(--pg-muted);border-bottom:1px solid var(--pg-blue);padding-bottom:3px}
.page .pnum{position:absolute;right:48px;top:14px;font-size:9px;color:var(--pg-muted)}
.page .body{position:absolute;left:72px;right:72px;top:78px;bottom:64px;overflow:hidden}
.page .ftr{position:absolute;left:72px;right:72px;bottom:28px;font-size:8px;color:#9aa3b2;display:flex;justify-content:space-between}
.page.cover .body{top:0;bottom:0;left:0;right:0}
.cv-bar{height:12px;background:linear-gradient(90deg,#4472C4,#7b3fe4)}
.cv-dots{position:absolute;left:30px;bottom:150px;width:190px;height:80px;background-image:radial-gradient(#c5d0e6 1.2px,transparent 1.3px);background-size:12px 12px;opacity:.9}
.cv{position:absolute;left:72px;right:72px;top:150px}
.cv .lp{font-weight:700;color:var(--pg-blue2);font-size:15px}
.cv .bp{font-weight:700;color:var(--pg-blue);font-size:54px;letter-spacing:.5px;margin-top:110px;line-height:1.1}
.cv .fm{font-weight:700;color:var(--pg-blue2);font-size:28px;margin-top:14px;line-height:1.2}
.cv .pp{font-size:15px;color:var(--pg-muted);margin-top:14px}
.cv .cl{font-weight:700;color:var(--pg-blue2);font-size:15px;margin-top:300px}
.cv-logo{position:absolute;right:72px;bottom:110px;font-style:italic;font-weight:700;font-size:22px;color:#1f3f9a;letter-spacing:.5px}
.cv-logo span{color:#6a8bdc;font-weight:400}
.cv-meta{position:absolute;left:72px;bottom:60px;font-size:9px;color:#9aa3b2}

.page h1.bh{font-size:10.5px;font-weight:700;color:#111;background:var(--pg-head);margin:16px 0 10px;padding:2px 4px;text-transform:none}
.page h2.bh{font-size:10.5px;font-weight:700;color:#111;background:var(--pg-head);margin:14px 0 8px;padding:2px 4px}
.page h2.bh.big{font-size:12.5px;font-weight:400;color:#1d2433}
.page .bh .i{color:#0000FF;font-weight:400;margin-left:4px;font-size:10px}
.page p{margin:0 0 7px}
.page p.just{text-align:justify;text-indent:28px}
.page p.fonte{font-size:8.5px;color:var(--pg-muted);margin-top:2px}
.page p.rot{font-weight:700;margin-top:8px}
.page ol.gov{margin:4px 0 6px 18px;padding-left:10px}
.page ol.gov li{margin:4px 0}
.page ol.gov div{margin:6px 0 6px 6px;text-align:justify}
.page ul.bul{margin:2px 0 8px 24px;padding:0}
.page ul.bul li{margin:2px 0}
.page table.bt{width:100%;border-collapse:collapse;margin:2px 0 4px;font-size:9px;color:var(--pg-muted)}
.page table.bt th{background:var(--pg-th);color:#333;text-align:left;font-weight:700;padding:2px 5px;border-top:1px solid #a6a6a6;border-bottom:1px solid #a6a6a6}
.page table.bt td{padding:2px 5px;border-bottom:1px solid #bfbfbf;vertical-align:top}
.page table.bt td+td,.page table.bt th+th{border-left:1px solid #bfbfbf}
.page table.bt tr.g td:first-child{font-weight:700;color:#333}
.page table.bt td.ind{padding-left:16px}
.page table.bt td.b{font-weight:700;color:#333}
.page table.bt.plain td{border-top:1px solid #bfbfbf}
.page .toc-t{font-weight:700;font-size:11px;margin:10px 0 16px;color:#333}
.page .toc a{display:flex;align-items:baseline;gap:4px;color:#333;text-decoration:none;margin:5px 0;font-size:10px;cursor:pointer}
.page .toc a.l2{padding-left:16px;font-size:9.5px}
.page .toc a .dots{flex:1;border-bottom:1px dotted #777;transform:translateY(-3px)}
.page mark.pend{background:#fff2a8;color:#7a4b00;padding:0 1px;border-radius:2px}
.page .muted{color:#9aa3b2}

/* edição na página */
body.editing .page [data-p]{outline:1px dashed transparent;border-radius:2px;cursor:text;transition:outline-color .1s,background .1s}
body.editing .page [data-p]:hover{outline-color:#7aa2ff;background:rgba(68,114,196,.06)}
body.editing .page [data-p]:focus{outline:2px solid #2f5bd3;background:#f3f7ff}
body.editing .page [data-tog]{cursor:pointer;border-radius:2px}
body.editing .page [data-tog]:hover{background:rgba(68,114,196,.15)}
body.editing .page [data-p]:empty::before{content:attr(data-ph);color:#b0b7c3;font-style:italic}
.rowtools{position:absolute;z-index:6;display:flex;gap:2px;background:#1d2433;border-radius:6px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rowtools button{border:0;background:none;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;cursor:pointer}
.rowtools button:hover{background:#3a4560}

/* ---------- diálogos ---------- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--txt);padding:0;max-width:min(720px,calc(100vw - 32px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh b{font-size:15px}
.db{padding:14px 18px;max-height:65vh;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.rv h4{margin:14px 0 6px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.rv h4 .k{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px}
.rv ul{margin:0;padding-left:18px}
.rv li{margin:3px 0}
.rv li a{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.k.bad{background:var(--badbg);color:var(--bad)}.k.warn{background:var(--warnbg);color:var(--warn)}.k.ok{background:var(--okbg);color:var(--ok)}.k.info{background:var(--accbg);color:var(--acc)}
.sumbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:100;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* ---------- impressão / PDF ---------- */
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .top,.banner,.mobtabs,.side,.vbar,.pglbl,.rowtools,dialog,.toast{display:none!important}
  .app{display:block;height:auto}
  .view{overflow:visible;background:#fff}
  .pages{zoom:1!important;padding:0;gap:0;display:block}
  .page{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  .pgwrap:last-child .page{break-after:auto;page-break-after:auto}
  body.editing .page [data-p]{outline:none!important;background:none!important}
  .page [data-p]:empty::before{content:""}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body class="editing" data-mob="pag">
<header class="top">
  <div class="brand"><div class="logo">BP</div>Gerador de Blueprint</div>
  <div class="doc-id" id="docId"></div>
  <span class="chip rasc" id="stChip">Rascunho</span>
  <div class="tb">
    <button class="btn" id="bUndo" title="Desfazer a última alteração (Ctrl+Z)" disabled>↶ Desfazer</button>
    <div class="menu">
      <button class="btn" id="bImp" aria-haspopup="true">Importar ▾</button>
      <div class="menu-pop" id="mImp" hidden>
        <button data-a="raiox">Pacote Raio-X (.md)<small>Pacote gerado pelo Raio-X Cliente</small></button>
        <button data-a="json">Blueprint salvo (.json)<small>JSON no formato do gerador da skill</small></button>
        <button data-a="exemplo">Carregar exemplo<small>Folha por HeadCount (referência da skill)</small></button>
        <button data-a="novo">Novo Blueprint em branco</button>
      </div>
    </div>
    <span class="sep"></span>
    <button class="btn pri" id="bRev">✓ Revisar e finalizar</button>
    <div class="menu">
      <button class="btn" id="bExp" aria-haspopup="true">Exportar ▾</button>
      <div class="menu-pop" id="mExp" hidden>
        <button data-a="docx">Word (.docx)<small>Mesmas páginas, títulos e tabelas do padrão do time</small></button>
        <button data-a="pdf">PDF<small>Abre a impressão: escolha "Salvar como PDF"</small></button>
        <button data-a="json">JSON para o gerador da skill<small>scripts/gerar_blueprint.py (modelo Word oficial)</small></button>
      </div>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<nav class="mobtabs"><button class="btn" data-m="ed" aria-pressed="false">Editor</button><button class="btn" data-m="pag" aria-pressed="true">Páginas do Word</button></nav>
<div class="app">
  <aside class="side" id="side"></aside>
  <section class="view" id="view">
    <div class="vbar">
      <label class="tog" title="Clique nos textos da página para alterar"><input type="checkbox" id="tEdit" checked> Editar na página</label>
      <span class="grow"></span>
      <select id="goPg" aria-label="Ir para a página"></select>
      <button class="btn sm" id="zOut" aria-label="Diminuir zoom">−</button>
      <span id="zLbl" style="min-width:40px;text-align:center">100%</span>
      <button class="btn sm" id="zIn" aria-label="Aumentar zoom">+</button>
      <button class="btn sm" id="zFit">Ajustar</button>
    </div>
    <div class="pages" id="pages"></div>
    <div class="rowtools" id="rowtools" hidden><button data-r="add">＋ linha abaixo</button><button data-r="up">↑</button><button data-r="dn">↓</button><button data-r="del">✕ remover</button></div>
  </section>
</div>
<input type="file" id="fRaio" accept=".md,.txt,.markdown" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button class="ib" data-close aria-label="Fechar">✕</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>

<script>
"use strict";
/* =====================================================================
   Gerador de Blueprint — editor com visualização das páginas do Word.
   Estrutura, textos fixos e formato de dados seguem a skill blueprint-leverpro
   (references/formato_json.md, padrao_oficial.md, pacote_raio_x.md).
   ===================================================================== */
const $=id=>document.getElementById(id);
const KEY="bp-leverpro-editor-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\*+/g,"").toLowerCase().replace(/\s+/g," ").trim();
const hoje=()=>new Date().toLocaleDateString("pt-BR");
function toast(t,ms){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||2600)}

/* ---------- textos fixos do padrão oficial ---------- */
const SOBRE=[
 "Este documento estabelece o *Blueprint*, considerado a versão oficial e controlada que orienta o planejamento, a implementação e a evolução do produto na plataforma de planejamento. Sua aprovação formal consolida o alinhamento entre as partes envolvidas e define a referência para as fases subsequentes de desenvolvimento, implantação e governança. O documento será disponibilizado via SharePoint.",

function completa(d){const b=vazio(),o=Object.assign(b,d||{});

  o.conta_destino=Object.assign(vazio().conta_destino,o.conta_destino||{});
  if(!Array.isArray(o.conta_destino.cabecalho)||o.conta_destino.cabecalho.length<2)o.conta_destino.cabecalho=["Linha","Conta Destino"];
  o.linhas_output=Object.assign(vazio().linhas_output,o.linhas_output||{});

  if(typeof o.observacoes.anotacoes==="string")o.observacoes.anotacoes=o.observacoes.anotacoes.split("\n").filter(Boolean);
  o.premissas=(o.premissas||[]).map(x=>Array.isArray(x)?[x[0]||"",x[1]||""]:[String(x),""]);
  o.linhas_entrada.linhas=(o.linhas_entrada.linhas||[]).map(l=>Array.isArray(l)?{linha:l[0]||"",obs:l[1]||""}:{linha:l.linha||"",obs:l.obs||"",grupo:!!l.grupo});

  o._meta=Object.assign(vazio()._meta,o._meta||{});return o}

/* ---------- markdown simples: **negrito**, *itálico*, [PENDENTE] ---------- */
function mdHtml(t){let s=esc(t);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
  s=s.replace(/\[PENDENTE\]/g,'<mark class="pend">[PENDENTE]</mark>');
  return s.replace(/\n/g,"<br>")}
function mdRuns(t){const out=[];String(t||"").split(/(\*\*[^*]+\*\*|\*[^*\n]+\*)/).forEach(p=>{if(!p)return;
  if(/^\*\*.+\*\*$/.test(p))out.push({t:p.slice(2,-2),b:1});else if(/^\*.+\*$/.test(p)&&p.length>2)out.push({t:p.slice(1,-1),i:1});else out.push({t:p})});return out}
const limpaFonte=t=>String(t||"").replace(/^(\s*fonte\s*:\s*)+/i,"");

function chaveRef(s){return norm(String(s).replace(/^\s*\d+\s*[-.)]\s*/,"").replace(/^=\s*/,""))}
function revisar(corrigir){const L=[],I=[],P=[],fx=[];const go=k=>k;
  /* correções automáticas possíveis sem novas informações */
  if(corrigir){
    ["premissas_fonte","dimensoes_fonte","linhas_entrada.fonte","conta_destino.fonte","linhas_output.fonte"].forEach(p=>{const v=getP(p);if(v&&v!==limpaFonte(v)){setP(p,limpaFonte(v));fx.push("\"Fonte:\" duplicado removido em "+p.split(".")[0].replace("_"," "))}});
    const dedup=(arr,nome,keyf)=>{const vis=new Set(),out=[];arr.forEach(r=>{const k=keyf(r);if(vis.has(k)){fx.push("Linha repetida removida em "+nome+": "+(Array.isArray(r)?r[0]:r.linha).replace(/\*/g,""));return}vis.add(k);out.push(r)});return out};
    S.linhas_output.memoria_calculo=dedup(S.linhas_output.memoria_calculo,"Memória de cálculo",r=>norm(r[0])+"|"+norm(r[1]));
    S.dimensoes=dedup(S.dimensoes,"Dimensões",r=>norm(r[0]));
    S.premissas=dedup(S.premissas,"Premissas",r=>norm(r[0])+"|"+norm(r[1]));
    const semNome=r=>/\(sem nome\)/i.test(Array.isArray(r)?r[0]:r.linha);
    if(S.linhas_output.memoria_calculo.some(semNome)){S.linhas_output.memoria_calculo=S.linhas_output.memoria_calculo.filter(r=>!semNome(r));fx.push("Linhas \"(sem nome)\" retiradas da memória de cálculo")}
    if(S.linhas_entrada.linhas.some(semNome)){S.linhas_entrada.linhas=S.linhas_entrada.linhas.filter(r=>!semNome(r));fx.push("Linhas \"(sem nome)\" retiradas das linhas de entrada")}

      if(!vistosM.has(k)){vistosM.add(k);const nr=(obs.match(/Repete em (\d+)/)||[])[1],mo=obs.split("·").map(x=>x.trim()).filter(x=>x&&!/^Repete em/.test(x)).join(" · ");
        const rep=nr?"\n(a mesma regra se repete em "+nr+" linhas"+(r[3]&&!reg?" — dimensões: "+r[3]:"")+")":"",mud=mo?"\n("+mo+")":"";
        D.linhas_output.memoria_calculo.push(["**"+nome+"**",(form||"[PENDENTE] Fórmula não descrita")+mud+rep]);
        if(/muda/i.test(obs))D.pendencias.push([nome,"Na plataforma a linha terá uma regra só: definir qual regra vale para a linha "+nome+" ("+obs.split("·")[0].trim()+")"])}}})});
  const entF=ent.filter(e=>!e.grupo||e.filhos>0).slice(0,80).map(e=>e.grupo?{linha:e.linha,obs:"Grupo",grupo:true}:{linha:e.linha,obs:e.obs});
  const ic=!!conf["Exemplos de linhas de input"];
  (blocos["Exemplos de linhas de input"]||[]).filter(x=>!/não informad/i.test(x)).forEach(x=>{if(!entF.some(e=>norm(e.linha)===norm(x)))entF.push({linha:x,obs:ic?"Input":"Input — [PENDENTE] validar"})});
  D.linhas_entrada.linhas=entF;if(entF.length){D.linhas_entrada.fonte=FONTE;D.linhas_entrada.observacao="Os *inputs* mencionados acima referem-se às informações constantes na planilha: "+(base||"do cliente");R.mapeado.push("Linhas de input/cálculo → "+entF.length+" linha(s) de entrada")}
  (blocos[Object.keys(blocos).find(k=>/^Exemplos preliminares de cálculo/.test(k))]||[]).filter(x=>!/não informad/i.test(x)).forEach(x=>{const m=x.match(/^(.+?)\s*[=:]\s*(.+)$/);const nome=m?m[1].trim():x;if(vistosM.has(norm(nome)))return;vistosM.add(norm(nome));
    D.linhas_output.memoria_calculo.push(["**"+nome+"**",m?m[2]:"[PENDENTE] Descrever a fórmula"])});
  if(D.linhas_output.memoria_calculo.length){D.linhas_output.fonte=FONTE+(abasP.length?" (aba principal "+abasP[0]+")":"");R.mapeado.push("Cálculos → "+D.linhas_output.memoria_calculo.length+" linha(s) na memória de cálculo")}
  /* --- achados da auditoria → pendências --- */
  achados.forEach(a=>{const ex=a.ex.slice(0,2).join("; "),t=norm(a.tipo+" "+a.texto);let txt;
    if(/numero fixo|valor fixo|constante|hardcode/.test(t))txt="Confirmar se o valor fixo dentro da fórmula deve virar premissa parametrizável"+(ex?" ("+ex+")":"");
    else if(/muda|periodo|ao longo/.test(t))txt="Na plataforma a linha terá uma regra só: definir qual regra vale"+(ex?" ("+ex+")":"");
    else if(/digitad|sobre a formula|por cima/.test(t))txt="Linhas com valores digitados sobre a fórmula em alguns meses: confirmar se são ajustes manuais (input) ou erro"+(ex?" ("+ex+")":"");
    else txt=(a.texto||a.tipo)+(ex?" ("+ex+")":"");
    D.pendencias.push([a.tipo+(a.aba?" — "+a.aba:""),txt])});
  if(achados.length)R.mapeado.push("Achados da auditoria → "+achados.length+" pendência(s)");
  /* --- glossário, respostas, pendências, resumo, reunião --- */
  tabelas.filter(t=>/Glossário/.test(t.lab)).forEach(t=>t.rows.forEach(r=>{if(r[0])D.glossario.push([r[0],r[1]||""])}));
  if(D.glossario.length)R.mapeado.push("Glossário da empresa → "+D.glossario.length+" termo(s)");
  D.observacoes.perguntas=pend.map(p=>[p.texto,"[PENDENTE] Sem resposta."]);
  if(pend.length)R.mapeado.push("Pendências (perguntas sem resposta) → Observações ("+pend.length+")");
  if(blocos.resumo){D.observacoes.resumo=blocos.resumo;R.mapeado.push("Resumo geral → Resumo do entendimento")}
  const an=[];if(blocos.reuniao)blocos.reuniao.split("\n").map(x=>x.replace(/^[-*]\s*/,"").trim()).filter(Boolean).forEach(x=>an.push(x));
  resp.forEach(r=>an.push(r.q.replace(/\*/g,"")+" — "+(r.r||"respondida")));D.observacoes.anotacoes=an;
  if(an.length)R.mapeado.push("Descrição da reunião e respostas → Anotações da reunião ("+an.length+")");
  if(valid.no.length)R.mapeado.push("Itens \"Para corrigir\" ("+valid.no.length+") não foram usados no Blueprint");
  /* --- papéis e versão: sem evidência → pendência --- */
  D.papeis=[["[PENDENTE] Participante","Consultoria","FP&A","Entendimento das regras de negócio"],["[PENDENTE] Participante",D.empresa||"[PENDENTE]","[PENDENTE] Área","Alinhamento de entendimento"]];
  D.versoes=[[hoje(),"V1.0","[PENDENTE] Solicitante","*Blueprint* Inicial"]];
  D._meta={status:"rascunho",finalizadoEm:"",origem:"Pacote Raio-X"+(arquivo?" — "+arquivo:"")+(cab[1]?" (gerado em "+cab[1]+")":"")};
  return{D:completa(D),R}}

function aposImportar(D,R,origem){

    S.papeis.forEach(p=>{if(p[1]==="[PENDENTE]"||p[1]===R.empOrig)p[1]=e});lastSnap="";abertas=new Set(["ficha"]);commit("Importação",{semStatus:1});renderAll();hideBanner();toast("Blueprint montado a partir de "+origem)};

    (R.mapeado.length?'<div class="rv"><h4>O que foi aproveitado</h4><ul>'+R.mapeado.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>":"")+

    [["Cancelar",null],["Sim, confirmado",()=>{if(confirma()===false)setTimeout(()=>aposImportar(D,R,origem),30)},"pri"]])}

const nomeArq=ext=>("BluePrint - "+(S.formulario||"Formulário")+" - "+(S.empresa||"Empresa")+"."+ext).replace(/[\\/:*?"<>|]/g,"-");
function baixar(blob,nome){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function jsonSkill(){const o=clone(S);delete o._meta;if(!o.objetivo)delete o.objetivo;if(!o.conta_destino.texto)delete o.conta_destino.texto;
  if(!o.identificacao.nome)o.identificacao.nome=o.formulario;
  o.secoes_extras.forEach(x=>{if(!x.tabela)delete x.tabela;if(!(x.marcadores||[]).length)delete x.marcadores});
  ["premissas_fonte","dimensoes_fonte","linhas_entrada.fonte","conta_destino.fonte","linhas_output.fonte"].forEach(p=>{const ks=p.split("."),l=ks.pop(),t=ks.reduce((a,k)=>a[k],o);t[l]=limpaFonte(t[l])});
  if(!o.observacoes.perguntas.length&&!o.observacoes.resumo&&!o.observacoes.anotacoes.length)delete o.observacoes;return o}
let docxLib=null;
function carregaDocx(){if(window.docx)return Promise.resolve(window.docx);if(docxLib)return docxLib;
  docxLib=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";s.onload=()=>ok(window.docx);
    s.onerror=()=>{const s2=document.createElement("script");s2.src="https://unpkg.com/docx@8.5.0/build/index.umd.js";s2.onload=()=>ok(window.docx);s2.onerror=()=>{docxLib=null;no(new Error("Sem acesso à biblioteca do Word"))};document.head.appendChild(s2)};document.head.appendChild(s)});return docxLib}
async function gerarDocx(){const X=await carregaDocx();
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,BorderStyle,ShadingType,AlignmentType,Header,Footer,PageNumber,TabStopType,TabStopPosition,LeaderType,HeadingLevel,PageBreak,HighlightColor}=X;
  const FONT="Open Sans",CINZA="595959";
  const runs=(t,o)=>{o=o||{};const out=[];String(t==null?"":t).split("\n").forEach((ln,li)=>{mdRuns(ln).forEach((r,ri)=>{
      String(r.t).split(/(\[PENDENTE\])/).forEach(pt=>{if(!pt)return;out.push(new TextRun({text:pt,bold:!!(r.b||o.b),italics:!!(r.i||o.i),font:FONT,size:o.size||19,color:o.color||(pt==="[PENDENTE]"?"7A4B00":"404040"),highlight:pt==="[PENDENTE]"?"yellow":undefined,break:li>0&&ri===0&&out.length?1:undefined}))})})
      if(!mdRuns(ln).length&&li>0)out.push(new TextRun({text:"",break:1}))});return out};
  const par=(t,o)=>{o=o||{};return new Paragraph({children:runs(t,o),spacing:{after:o.after!=null?o.after:100,before:o.before||0},alignment:o.just?AlignmentType.JUSTIFIED:undefined,indent:o.indent,keepNext:!!o.kwn})};
  const head=(t,lvl)=>new Paragraph({heading:lvl===1?HeadingLevel.HEADING_1:HeadingLevel.HEADING_2,keepNext:true,spacing:{before:240,after:160},shading:{type:ShadingType.CLEAR,color:"auto",fill:"B4C6E7"},
      children:[new TextRun({text:t+" ",bold:lvl===1||lvl===2&&!t.startsWith("Identifica"),font:FONT,size:lvl===2&&t.startsWith("Identifica")?25:20,color:"111111"}),new TextRun({text:"ⓘ",font:FONT,size:18,color:"0000FF"})]});
  const brd={style:BorderStyle.SINGLE,size:4,color:"BFBFBF"},nb={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
  const cell=(c,o)=>new TableCell({children:[new Paragraph({children:runs(c.md,{size:17,color:o.th?"333333":CINZA,b:o.th||c.b}),indent:c.ind?{left:220}:undefined,spacing:{after:0}})],
      width:{size:o.w,type:WidthType.PERCENTAGE},shading:o.th?{type:ShadingType.CLEAR,color:"auto",fill:"D9D9D9"}:undefined,margins:{top:30,bottom:30,left:80,right:80}});
  const tabela=b=>{const w=b.w||Array(b.head?b.head.length:2).fill(100/(b.head?b.head.length:2)),rows=[];
    if(b.head)rows.push(new TableRow({tableHeader:true,children:b.head.map((h,j)=>cell(typeof h==="string"?{md:h}:h,{th:1,w:w[j]}))}));
    const rr=b.rows.length?b.rows:[{cells:Array(w.length).fill({md:"..."})}];
    rr.forEach(r=>rows.push(new TableRow({cantSplit:true,children:r.cells.map((c,j)=>cell(Object.assign({},c,{b:c.b||(r.g&&j===0)}),{w:w[j]}))})));
    return new Table({rows,width:{size:100,type:WidthType.PERCENTAGE},borders:{top:brd,bottom:brd,left:nb,right:nb,insideHorizontal:brd,insideVertical:brd}})};
  /* páginas do sumário calculadas na pré-visualização */
  renderAll();const ch=[];
  /* capa */
  ch.push(new Paragraph({spacing:{before:1600,after:0},children:[new TextRun({text:"",bold:true,font:FONT,size:30,color:"2E74B5"})]}));
  ch.push(new Paragraph({spacing:{before:1800,after:120},children:[new TextRun({text:"BLUEPRINT",bold:true,font:FONT,size:96,color:"4472C4"})]}));
  ch.push(new Paragraph({spacing:{after:200},children:[new TextRun({text:S.formulario||"Formulário",bold:true,font:FONT,size:52,color:"2E74B5"})]}));
  ch.push(new Paragraph({children:[new TextRun({text:"Planejamento do Produto",font:FONT,size:28,color:CINZA})]}));
  ch.push(new Paragraph({spacing:{before:4200},children:[new TextRun({text:"Cliente: "+(S.empresa||""),bold:true,font:FONT,size:30,color:"2E74B5"})]}));
  ch.push(new Paragraph({alignment:AlignmentType.RIGHT,spacing:{before:900},children:[new TextRun({text:"LEVER",bold:true,italics:true,font:FONT,size:40,color:"1F3F9A"}),new TextRun({text:"PRO",italics:true,font:FONT,size:40,color:"6A8BDC"})]}));
  /* sumário */
  ch.push(new Paragraph({pageBreakBefore:true,spacing:{after:300},children:[new TextRun({text:"SUMÁRIO",bold:true,font:FONT,size:22,color:"333333"})]}));
  tocIds.forEach(t=>ch.push(new Paragraph({tabStops:[{type:TabStopType.RIGHT,position:9000,leader:LeaderType.DOT}],indent:t.nivel===2?{left:300}:undefined,spacing:{after:90},
    children:[new TextRun({text:t.text,font:FONT,size:t.nivel===1?20:19,color:"333333"}),new TextRun({text:"\t"+(t.pg||""),font:FONT,size:20,color:"333333"})]})));
  /* sobre este documento */
  const h1s=new Paragraph({pageBreakBefore:true,heading:HeadingLevel.HEADING_1,keepNext:true,spacing:{after:200},shading:{type:ShadingType.CLEAR,color:"auto",fill:"B4C6E7"},children:[new TextRun({text:"SOBRE ESTE DOCUMENTO ",bold:true,font:FONT,size:20,color:"111111"}),new TextRun({text:"ⓘ",font:FONT,size:18,color:"0000FF"})]});

    else if(b.t==="p"){const md=b.segs.map(s=>s.path&&s.clean?limpaFonte(s.md):s.md).join("");if(!md.replace(/\*\*Observação:\*\* |Fonte: /,"").trim())return;

  const doc=new Document({creator:"Gerador de Blueprint",title:"BluePrint - "+S.formulario+" - "+S.empresa,
    styles:{default:{document:{run:{font:FONT,size:19,color:"404040"}}},paragraphStyles:[{id:"Heading1",name:"Heading 1",basedOn:"Normal",next:"Normal",run:{font:FONT,size:20,bold:true,color:"111111"}},{id:"Heading2",name:"Heading 2",basedOn:"Normal",next:"Normal",run:{font:FONT,size:20,color:"111111"}}]},
    sections:[{properties:{titlePage:true,page:{size:{width:11906,height:16838},margin:{top:1300,bottom:1100,left:1080,right:1080,header:500,footer:500}}},

      children:ch}]});
  return Packer.toBlob(doc)}
async function exportar(tipo){
  if(tipo==="json"){baixar(new Blob([JSON.stringify(jsonSkill(),null,2)],{type:"application/json"}),"dados - "+nomeArq("json").replace(/^BluePrint - /,""));
    dlg("JSON exportado",'<p style="margin-top:0">Para gerar o Word com o <b>modelo oficial</b> da skill (molde <code>assets/modelo_blueprint.docx</code>, sumário com páginas calculadas):</p><pre style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px;font-size:12px">python scripts/gerar_blueprint.py dados.json "'+esc(nomeArq("docx"))+'"</pre><p class="hint">Ou envie o JSON ao Claude com a skill de Blueprint.</p>');return}
